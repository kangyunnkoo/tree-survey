<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>수목 위치도 및 노션 전송</title>
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        
        body {
            display: flex;
            flex-direction: column;
        }

        #map-wrapper {
            width: 100%;
            flex: 1;
            min-height: 180px;
            position: relative;
            overflow: hidden;
        }

        /* 100% 크기에서 scale(줌 배율) 적용 */
        #map {
            width: 100%;
            height: 100%;
            transform: scale(var(--map-scale, 1));
            transform-origin: center center;
            transition: transform 0.3s ease;
        }

        /* 우측 상단 제어 버튼 및 옵션 그룹 스타일 (세로 배치) */
        .control-group {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            width: 170px;
        }

        .map-btn, .map-select {
            background: #ffffff;
            color: #333333;
            border: 1px solid #cccccc;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            user-select: none;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        .map-select {
            text-align-last: center;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 14px;
            padding-right: 25px;
        }

        .map-btn:hover, .map-select:hover {
            background: #f0f0f0;
        }

        .map-btn.active {
            background-color: #0d47a1;
            color: white;
            border-color: #0d47a1;
        }

        /* 원크기 버튼 밑 작업주수 / 작업완료주수 표시 박스 */
        .count-summary-box {
            background: #ffffff;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            line-height: 1.35;
        }
        .count-summary-label {
            display: block;
            font-size: 11px;
            color: #64748b;
            margin-bottom: 2px;
        }
        .count-summary-value {
            font-size: 13px;
            color: #0d47a1;
        }
        .count-summary-done {
            color: #d32f2f;
        }

        /* 하단 입력 패널 (항상 열려 있고 내용에 따라 높이 유동 조절) */
        #panel {
            width: 100%;
            max-height: 45vh;
            flex-shrink: 0;
            background: #ffffff;
            border-top: 1px solid #ccc;
            box-sizing: border-box;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        #panel-header-bar {
            height: 36px;
            flex-shrink: 0;
            background: #f1f3f5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            gap: 5px;
            font-size: 12px;
            font-weight: bold;
            color: #495057;
            border-bottom: 1px solid #dee2e6;
            user-select: none;
        }
        .header-title-text {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .bar-btn {
            background: #ffffff;
            color: #1e293b;
            border: 1px solid #94a3b8;
            border-radius: 5px;
            padding: 4px 7px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .bar-btn.listening {
            background: #dc2626;
            color: #ffffff;
            border-color: #dc2626;
            animation: pulseMic 1.2s infinite;
        }
        .bar-btn.muted {
            background: #e2e8f0;
            color: #475569;
            border-color: #cbd5e1;
        }
        @keyframes pulseMic {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        #voice-status-bar {
            display: none;
            background: #eff6ff;
            border: 1px solid #93c5fd;
            color: #1e3a8a;
            border-radius: 6px;
            padding: 7px 10px;
            font-size: 12px;
            line-height: 1.35;
            transition: all 0.2s ease;
        }
        #voice-status-bar.alert-success {
            background: #dcfce7;
            border: 2px solid #16a34a;
            color: #14532d;
            font-weight: bold;
        }
        #voice-status-bar.alert-all-done {
            background: #fef3c7;
            border: 2px solid #d97706;
            color: #78350f;
            font-weight: bold;
        }
        #voice-status-bar.alert-error {
            background: #fee2e2;
            border: 2px solid #dc2626;
            color: #7f1d1d;
            font-weight: bold;
        }

        #panel-body {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        /* 모바일 및 다양한 화면 너비에 맞춰 유동적으로 줄바꿈되는 입력 영역 */
        .input-row-inline {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: stretch;
        }

        input { 
            height: 38px; 
            font-size: 13px; 
            border-radius: 6px; 
            border: 1px solid #ddd; 
            box-sizing: border-box; 
            padding: 0 10px;
        }
        input[readonly] { 
            background-color: #f5f5f5; 
            color: #555; 
        }

        .field-no {
            flex: 1 1 70px;
            min-width: 65px;
        }
        .field-species {
            flex: 2 1 120px;
            min-width: 110px;
        }
        .field-qty {
            flex: 1 1 80px;
            min-width: 75px;
        }

        .btn-send { 
            height: 38px; 
            flex: 1.5 1 110px;
            min-width: 100px;
            font-size: 13px;
            background-color: #0d47a1; 
            color: white; 
            font-weight: bold; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer;
            white-space: nowrap;
            padding: 0 14px;
            transition: background-color 0.2s ease;
        }
        .btn-send:disabled { background-color: #90caf9 !important; cursor: not-allowed; }

        /* 최근 전송 내용 표시 영역 */
        #last-sent-box {
            min-height: 36px;
            padding: 8px 10px;
            background-color: #f0fdf4;
            border: 1px solid #2b8a3e;
            border-radius: 6px;
            font-size: 12px;
            color: #222;
            display: none;
            box-sizing: border-box;
        }
        .last-sent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .last-sent-text {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            flex: 1 1 180px;
        }
        .btn-resend {
            background-color: #e03131; 
            color: white; 
            font-size: 11px; 
            font-weight: bold;
            border: none; 
            border-radius: 4px; 
            padding: 5px 10px; 
            cursor: pointer; 
            white-space: nowrap;
            flex-shrink: 0;
        }
    </style>
    <!-- 카카오맵 JS SDK -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=4010951d8779c420a474f095fd26c0a6"></script>
</head>
<body>
    <div id="map-wrapper">
        <!-- 우측 상단 제어 버튼, 옵션 및 작업/완료 주수 요약 영역 -->
        <div class="control-group">
            <button id="zoom-btn" class="map-btn" onclick="toggleZoom()">2배 확대 (OFF)</button>
            <select id="marker-size-select" class="map-select" onchange="changeMarkerSize()">
                <option value="16">원크기: 작게</option>
                <option value="20" selected>원크기: 보통</option>
                <option value="26">원크기: 크게</option>
                <option value="32">원크기: 아주 크게</option>
            </select>
            <div id="tree-count-box" class="count-summary-box">
                <span class="count-summary-label">작업주수 / 작업완료주수</span>
                <span class="count-summary-value">
                    <span id="total-qty-text">0</span> / <span id="done-qty-text" class="count-summary-done">0</span>
                </span>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <!-- 하단 입력 폼 패널 (항상 열려 있음) -->
    <div id="panel">
        <div id="panel-header-bar">
            <span class="header-title-text">🌳 작업·노션 전송</span>
            <button id="test-voice-btn" class="bar-btn" type="button" onclick="testBeepAlert()">🔔 비프테스트</button>
            <button id="mute-btn" class="bar-btn" type="button" onclick="toggleMuteAlert()">🔊 알림 ON</button>
            <button id="voice-btn" class="bar-btn" type="button" onclick="toggleVoiceRecognition()">🎙️ 음성 OFF</button>
        </div>

        <div id="panel-body">
            <div id="voice-status-bar">
                <strong>🎙️ 상태:</strong> <span id="voice-status-text">대기 중 ("15번 시작", "완료", "14번 완료", "14번 취소")</span>
            </div>

            <!-- 화면 크기에 따라 유동적으로 줄바꿈되는 입력 및 전송 영역 -->
            <div class="input-row-inline">
                <input type="text" id="treeId" class="field-no" readonly placeholder="번호">
                <input type="text" id="species" class="field-species" readonly placeholder="수종">
                <input type="number" id="quantity" class="field-qty" placeholder="주수">
                <!-- finished 상태를 담는 숨은 필드 (전송할 목표 상태) -->
                <input type="hidden" id="finished" value="false">
                <button id="sendBtn" class="btn-send" onclick="sendToNotion()">완료</button>
            </div>

            <div id="last-sent-box">
                <div class="last-sent-header">
                    <div class="last-sent-text">
                        <strong id="status-title" style="color: #2b8a3e;">[전송 상태]</strong>
                        <span id="last-sent-info">-</span>
                    </div>
                    <button class="btn-resend" onclick="resendToNotion()">↻ 재전송</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // 1. URL 파라미터 파싱 및 지도 초기화
        // -------------------------------------------------------------
        const params = new URLSearchParams(window.location.search);
        const masterId = params.get("master_id") || "";
        const centerLat = parseFloat(params.get("centerLat")) || 37.5665;
        const centerLng = parseFloat(params.get("centerLng")) || 126.9780;

        const initialCenter = new kakao.maps.LatLng(centerLat, centerLng);

        const mapContainer = document.getElementById("map");
        const mapOption = {
            center: initialCenter,
            level: 1
        };
        const map = new kakao.maps.Map(mapContainer, mapOption);

        const markerList = [];
        let lastPayload = null;

        // 단일 Make 웹훅 URL (조회: action=load / 전송: action=update)
        const webhookUrl = "https://hook.eu2.make.com/w53mbrle7l602lux6nfjb9o0qq66c7yi";

        // 깜빡임(Blink) 상태 관리 변수
        let activeBlinkItem = null; 
        let blinkTimer = null;      

        kakao.maps.event.addListener(map, 'click', function() {
            stopBlinking();
        });

        // -------------------------------------------------------------
        // 2. 확대/축소(Zoom) 시 화면 중심 고정 보정
        // -------------------------------------------------------------
        let zoomStartCenter = null;

        kakao.maps.event.addListener(map, 'zoom_start', function() {
            zoomStartCenter = map.getCenter();
        });

        kakao.maps.event.addListener(map, 'zoom_changed', function() {
            if (zoomStartCenter) {
                map.setCenter(zoomStartCenter);
            }
        });

        // -------------------------------------------------------------
        // 3. 2배 확대 / 원래 화면 토글 제어
        // -------------------------------------------------------------
        let isZoomed2X = false; 

        function toggleZoom() {
            const visualCenter = map.getCenter();
            const mapEl = document.getElementById("map");
            const zoomBtn = document.getElementById("zoom-btn");

            isZoomed2X = !isZoomed2X;

            if (isZoomed2X) {
                mapEl.style.setProperty("--map-scale", "2");
                zoomBtn.textContent = "2배 확대 (ON)";
                zoomBtn.classList.add("active");
            } else {
                mapEl.style.setProperty("--map-scale", "1");
                zoomBtn.textContent = "2배 확대 (OFF)";
                zoomBtn.classList.remove("active");
            }

            updateMarkersDisplay(isZoomed2X);

            setTimeout(() => {
                map.relayout();
                map.setCenter(visualCenter);
            }, 300);
        }

        // -------------------------------------------------------------
        // 4. 원숫자 사이즈 변경 제어
        // -------------------------------------------------------------
        let targetScreenSize = 20; 

        function changeMarkerSize() {
            const selectEl = document.getElementById("marker-size-select");
            targetScreenSize = parseInt(selectEl.value, 10);
            updateMarkersDisplay(isZoomed2X);
        }

        function updateMarkersDisplay(zoomed2X) {
            markerList.forEach(item => {
                const isBlinkingTarget = (activeBlinkItem && activeBlinkItem.no === item.no);
                let customBg = item.finished ? "#d32f2f" : "#0d47a1";
                if (isBlinkingTarget) {
                    customBg = item._blinkState ? "#ff9800" : (item.finished ? "#d32f2f" : "#0d47a1");
                }
                const newImage = createNumberMarker(item.no, item.quantity, customBg, zoomed2X);
                item.marker.setImage(newImage);
            });
        }

        // -------------------------------------------------------------
        // 5. 마커 이미지 생성 (배경색 커스텀 지정 가능)
        // -------------------------------------------------------------
        function createNumberMarker(num, quantity, bgColor, zoomed2X = false) {
            const circleSize = zoomed2X ? targetScreenSize / 2 : targetScreenSize;
            const scale = 2; 

            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");

            const subText = quantity ? ` (${quantity})` : "";
            const subFontSize = circleSize * 0.45;
            ctx.font = `bold ${subFontSize}px 'Malgun Gothic', Arial, sans-serif`;
            const subTextMetrics = ctx.measureText(subText);
            const subTextWidth = subText ? subTextMetrics.width + 2 : 0;

            const totalWidth = circleSize + subTextWidth;
            const totalHeight = circleSize;

            canvas.width = totalWidth * scale;
            canvas.height = totalHeight * scale;

            ctx.scale(scale, scale);

            ctx.translate(circleSize / 2, totalHeight / 2);

            const circleRadius = circleSize / 2;
            
            ctx.fillStyle = bgColor;
            ctx.beginPath();
            ctx.arc(0, 0, circleRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 0.8;
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            const fontSize = circleSize * 0.52;
            ctx.font = `bold ${fontSize}px 'Malgun Gothic', Arial, sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(num, 0, 0.2);

            if (subText) {
                ctx.font = `bold ${subFontSize}px 'Malgun Gothic', Arial, sans-serif`;
                ctx.fillStyle = "blue";
                ctx.textAlign = "left";
                ctx.textBaseline = "middle";
                const textStartX = circleRadius + 2;
                ctx.fillText(subText, textStartX, 0.2);
            }

            const imageSize = new kakao.maps.Size(totalWidth, totalHeight);
            const imageOption = {
                offset: new kakao.maps.Point(circleSize / 2, totalHeight / 2)
            };

            return new kakao.maps.MarkerImage(canvas.toDataURL("image/png"), imageSize, imageOption);
        }

        // -------------------------------------------------------------
        // 6. 깜빡임 제어, 마커 선택(클릭 동작) 및 폼 상태 동기화
        // -------------------------------------------------------------
        function stopBlinking() {
            if (blinkTimer) {
                clearInterval(blinkTimer);
                blinkTimer = null;
            }
            if (activeBlinkItem) {
                activeBlinkItem._blinkState = false;
                const normalBg = activeBlinkItem.finished ? "#d32f2f" : "#0d47a1";
                const normalImage = createNumberMarker(activeBlinkItem.no, activeBlinkItem.quantity, normalBg, isZoomed2X);
                activeBlinkItem.marker.setImage(normalImage);
                activeBlinkItem = null;
            }
        }

        function startBlinking(item) {
            stopBlinking(); 
            activeBlinkItem = item;
            activeBlinkItem._blinkState = false;

            blinkTimer = setInterval(() => {
                activeBlinkItem._blinkState = !activeBlinkItem._blinkState;
                const baseBg = activeBlinkItem.finished ? "#d32f2f" : "#0d47a1";
                const color = activeBlinkItem._blinkState ? "#ff9800" : baseBg;
                const blinkImage = createNumberMarker(activeBlinkItem.no, activeBlinkItem.quantity, color, isZoomed2X);
                activeBlinkItem.marker.setImage(blinkImage);
            }, 400);
        }

        function populateFormOnly(item) {
            if (!item) return;
            document.getElementById('treeId').value = item.no;
            document.getElementById('species').value = item.species;
            document.getElementById('quantity').value = item.quantity;
            syncFormByFinishedState(item.finished);
        }

        function selectMarkerByItem(item) {
            if (!item) return;
            populateFormOnly(item);
            startBlinking(item);
            map.setCenter(new kakao.maps.LatLng(item.lat, item.lng));
            setTimeout(() => { map.relayout(); }, 100);
        }

        function syncFormByFinishedState(isFinished) {
            const sendBtn = document.getElementById('sendBtn');
            const finishedInput = document.getElementById('finished');

            if (isFinished) {
                sendBtn.innerText = "취소";
                sendBtn.style.backgroundColor = "#d32f2f";
                finishedInput.value = "false";
            } else {
                sendBtn.innerText = "완료";
                sendBtn.style.backgroundColor = "#0d47a1";
                finishedInput.value = "true";
            }
        }

        function getQuantityStats() {
            let totalQty = 0;
            let doneQty = 0;

            markerList.forEach(item => {
                const qty = parseInt(item.quantity, 10) || 0;
                totalQty += qty;
                if (item.finished) {
                    doneQty += qty;
                }
            });

            const remainingQty = Math.max(0, totalQty - doneQty);
            return { totalQty, doneQty, remainingQty };
        }

        function updateQuantitySummary() {
            const { totalQty, doneQty } = getQuantityStats();
            document.getElementById('total-qty-text').textContent = totalQty.toLocaleString();
            document.getElementById('done-qty-text').textContent = doneQty.toLocaleString();
        }

        // -------------------------------------------------------------
        // 7. 데이터 로드 및 마커 생성 (단일 웹훅 action=load 사용)
        // -------------------------------------------------------------
        async function loadMarkerData() {
            if (!masterId) return [];
            try {
                const res = await fetch(`${webhookUrl}?action=load&master_id=${encodeURIComponent(masterId)}`);
                if (!res.ok) throw new Error("서버 응답 오류");
                
                let data = await res.json();
                if (typeof data === 'string') {
                    data = JSON.parse(data);
                }

                return data.map(r => ({
                    no: r.no,
                    species: r.species || '-',
                    quantity: parseInt(r.quantity, 10) || 1,
                    finished: r.finished === true || r.finished === "true" || r.finished === 1 || r.finished === "1",
                    lat: parseFloat(r.lat),
                    lng: parseFloat(r.lng)
                }));
            } catch (e) {
                console.error("데이터 로드 실패:", e);
                return [];
            }
        }

        async function drawMarkers() {
            stopBlinking();
            markerList.forEach(m => m.marker.setMap(null));
            markerList.length = 0;

            const data = await loadMarkerData();

            data.forEach((row) => {
                if (isNaN(row.lat) || isNaN(row.lng)) return;
                
                const defaultBg = row.finished ? "#d32f2f" : "#0d47a1";
                const markerImage = createNumberMarker(row.no, row.quantity, defaultBg, isZoomed2X);
                const marker = new kakao.maps.Marker({
                    position: new kakao.maps.LatLng(row.lat, row.lng),
                    image: markerImage,
                    map: map
                });

                const item = {
                    no: row.no,
                    quantity: row.quantity,
                    species: row.species,
                    finished: row.finished,
                    lat: row.lat,
                    lng: row.lng,
                    marker: marker,
                    _blinkState: false
                };
                markerList.push(item);

                kakao.maps.event.addListener(marker, "click", () => {
                    selectMarkerByItem(item);
                });
            });

            updateQuantitySummary();
        }

        // -------------------------------------------------------------
        // 8. 노션 전송 및 재전송 처리 (단일 웹훅 action=update 사용)
        // -------------------------------------------------------------
        window.sendToNotion = function(overrideOptions = null) {
            const treeId = overrideOptions && overrideOptions.treeId !== undefined
                ? String(overrideOptions.treeId)
                : document.getElementById('treeId').value;
            const targetItem = markerList.find(item => String(item.no).trim() === String(treeId).trim());

            const species = overrideOptions && overrideOptions.species !== undefined
                ? overrideOptions.species
                : (document.getElementById('species').value || (targetItem ? targetItem.species : '-'));

            const rawQty = overrideOptions && overrideOptions.quantity !== undefined
                ? overrideOptions.quantity
                : (document.getElementById('quantity').value || (targetItem ? targetItem.quantity : 1));

            const finishedVal = overrideOptions && overrideOptions.finished !== undefined
                ? Boolean(overrideOptions.finished)
                : (document.getElementById('finished').value === "true");

            if (!treeId) {
                alert('마커를 선택하거나 음성으로 번호를 먼저 지정해 주세요.');
                return;
            }

            const parsedQty = rawQty ? parseInt(rawQty, 10) : 1;

            lastPayload = {
                action: "update",
                master_id: masterId,
                tree_id: treeId,
                species: species,
                quantity: parsedQty,
                finished: finishedVal,
                lat: targetItem ? targetItem.lat : null,
                lng: targetItem ? targetItem.lng : null
            };

            executeFetch(lastPayload);
        };

        function executeFetch(payload) {
            const sendBtn = document.getElementById('sendBtn');
            const originalText = sendBtn.innerText;
            const originalBgColor = sendBtn.style.backgroundColor;
            
            sendBtn.disabled = true;
            sendBtn.innerText = "전송 중...";

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (!response.ok) throw new Error('서버 응답 오류 (' + response.status + ')');
                return response.json().catch(() => ({ status: 'success' }));
            })
            .then(data => {
                const actionLabel = payload.finished ? "완료" : "취소";

                const target = markerList.find(item => String(item.no).trim() === String(payload.tree_id).trim());
                if (target) {
                    target.finished = payload.finished;
                    target.quantity = payload.quantity;
                }

                if (String(document.getElementById('treeId').value).trim() === String(payload.tree_id).trim()) {
                    document.getElementById('quantity').value = payload.quantity;
                    syncFormByFinishedState(payload.finished);
                }

                stopBlinking();
                updateMarkersDisplay(isZoomed2X);
                updateQuantitySummary();

                const { totalQty, remainingQty } = getQuantityStats();
                const isAllFinished = totalQty > 0 && remainingQty === 0;

                if (isAllFinished) {
                    setStatusBanner(`No.${payload.tree_id} ${actionLabel} · 모든 작업이 끝났습니다! (잔여 0주)`, 'all-done');
                    updateDisplayBox(payload, true, `[${actionLabel} · 전체 완료]`);
                    playAllDoneNotification();
                } else {
                    const statusMsg = `No.${payload.tree_id} ${actionLabel} · 잔여 ${remainingQty.toLocaleString()}주`;
                    setStatusBanner(statusMsg, 'success');
                    updateDisplayBox(payload, true, `[${actionLabel} 성공]`);
                    playBeep(payload.finished ? 'success' : 'cancel');
                }
            })
            .catch(error => {
                setStatusBanner(`전송 실패: ${error.message}`, 'error');
                updateDisplayBox(payload, false, '[전송 실패]');
                playBeep('error');
            })
            .finally(() => {
                sendBtn.disabled = false;
                if (document.getElementById('sendBtn').innerText === "전송 중...") {
                    sendBtn.innerText = originalText;
                    sendBtn.style.backgroundColor = originalBgColor;
                }
            });
        }

        function updateDisplayBox(payload, isSuccess, titleText) {
            const displayBox = document.getElementById('last-sent-box');
            const statusTitle = document.getElementById('status-title');
            const displayInfo = document.getElementById('last-sent-info');
            const stateText = payload.finished ? "완료(true)" : "취소(false)";

            if (isSuccess) {
                displayBox.style.backgroundColor = '#f0fdf4';
                displayBox.style.borderColor = '#16a34a';
                displayBox.style.borderWidth = '2px';
                statusTitle.style.color = '#15803d';
            } else {
                displayBox.style.backgroundColor = '#fff5f5';
                displayBox.style.borderColor = '#e03131';
                displayBox.style.borderWidth = '2px';
                statusTitle.style.color = '#e03131';
            }

            statusTitle.innerText = titleText;
            displayInfo.innerHTML = `No.<b>${payload.tree_id}</b> · ${payload.species} · <b>${payload.quantity}주</b> (${stateText})`;
            displayBox.style.display = 'block';
        }

        window.resendToNotion = function() {
            if (!lastPayload) {
                alert('재전송할 최근 정보가 없습니다.');
                return;
            }
            executeFetch(lastPayload);
        };

        // -------------------------------------------------------------
        // 9. Web Audio 비프음, 전체 완료 팡파레/음성 및 STT 제어
        // -------------------------------------------------------------
        let audioCtx = null;
        let isMuted = false;
        let statusHighlightTimer = null;

        function ensureAudioContext() {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return null;
            if (!audioCtx) {
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
            return audioCtx;
        }

        function playTone(freq, startOffsetSec, durationSec, type = 'sine', gainPeak = 0.25) {
            const ctx = ensureAudioContext();
            if (!ctx) return;

            const now = ctx.currentTime + startOffsetSec;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, now);

            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(gainPeak, now + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + durationSec);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now);
            osc.stop(now + durationSec + 0.02);
        }

        function playBeep(mode = 'success') {
            if (isMuted) return;
            try {
                if (mode === 'success') {
                    // 완료: 밝고 상승하는 2음 (A5 -> D6)
                    playTone(880, 0, 0.11, 'sine', 0.25);
                    playTone(1174.66, 0.13, 0.15, 'sine', 0.25);
                } else if (mode === 'cancel') {
                    // 취소: 확실히 구분되는 저음 3연타 하강음 (G4 -> E4 -> C4, sawtooth)
                    playTone(392.00, 0.00, 0.09, 'sawtooth', 0.22);
                    playTone(329.63, 0.11, 0.09, 'sawtooth', 0.22);
                    playTone(261.63, 0.22, 0.16, 'sawtooth', 0.24);
                } else if (mode === 'error') {
                    playTone(220, 0, 0.25, 'sawtooth', 0.22);
                } else {
                    playTone(784, 0, 0.12, 'sine', 0.22);
                }
            } catch (e) {
                console.error("비프음 재생 오류:", e);
            }
        }

        function playAllDoneNotification() {
            if (isMuted) return;

            try {
                playTone(523.25, 0.00, 0.12, 'triangle', 0.3);
                playTone(659.25, 0.13, 0.12, 'triangle', 0.3);
                playTone(783.99, 0.26, 0.12, 'triangle', 0.32);
                playTone(1046.50, 0.40, 0.32, 'sine', 0.35);
            } catch (e) {
                console.error("전체 완료 팡파레 오류:", e);
            }

            if ('speechSynthesis' in window) {
                try {
                    window.speechSynthesis.cancel();
                    const utter = new SpeechSynthesisUtterance("모든 작업이 끝났습니다");
                    utter.lang = 'ko-KR';
                    utter.rate = 1.05;
                    utter.volume = 1.0;

                    if (recognition && isVoiceEnabled) {
                        isSpeakingNow = true;
                        try { recognition.stop(); } catch (e) {}
                    }

                    utter.onend = () => {
                        isSpeakingNow = false;
                        if (recognition && isVoiceEnabled) {
                            scheduleRecognitionRestart(200);
                        }
                    };
                    utter.onerror = () => {
                        isSpeakingNow = false;
                        if (recognition && isVoiceEnabled) {
                            scheduleRecognitionRestart(200);
                        }
                    };

                    setTimeout(() => {
                        window.speechSynthesis.speak(utter);
                    }, 350);
                } catch (e) {
                    isSpeakingNow = false;
                }
            }
        }

        function updateMuteButtonUI() {
            const btn = document.getElementById('mute-btn');
            if (!btn) return;
            if (isMuted) {
                btn.textContent = "🔇 음소거";
                btn.classList.add("muted");
            } else {
                btn.textContent = "🔊 알림 ON";
                btn.classList.remove("muted");
            }
        }

        window.toggleMuteAlert = function() {
            isMuted = !isMuted;
            updateMuteButtonUI();
            if (isMuted && 'speechSynthesis' in window) {
                try { window.speechSynthesis.cancel(); } catch (e) {}
            }
            if (!isMuted) {
                ensureAudioContext();
                playBeep('info');
                setStatusBanner("알림 소리 켜짐", 'normal');
            } else {
                setStatusBanner("알림 음소거 상태 (화면 알림만 표시)", 'normal');
            }
        };

        window.testBeepAlert = function() {
            if (isMuted) {
                isMuted = false;
                updateMuteButtonUI();
            }
            const { remainingQty } = getQuantityStats();
            setStatusBanner(`전체 완료 알림 테스트 · 잔여 ${remainingQty.toLocaleString()}주`, 'all-done');
            playAllDoneNotification();
        };

        function setStatusBanner(msg, styleType = 'normal') {
            const bar = document.getElementById('voice-status-bar');
            const textEl = document.getElementById('voice-status-text');
            if (!bar || !textEl) return;

            bar.style.display = 'block';
            textEl.textContent = msg;

            bar.classList.remove('alert-success', 'alert-all-done', 'alert-error');
            if (styleType === 'success') {
                bar.classList.add('alert-success');
            } else if (styleType === 'all-done') {
                bar.classList.add('alert-all-done');
            } else if (styleType === 'error') {
                bar.classList.add('alert-error');
            }

            if (statusHighlightTimer) {
                clearTimeout(statusHighlightTimer);
            }
            if (styleType !== 'normal') {
                statusHighlightTimer = setTimeout(() => {
                    bar.classList.remove('alert-success', 'alert-all-done', 'alert-error');
                }, 4000);
            }
        }

        // 음성 인식 (STT) 제어
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isVoiceEnabled = false;
        let isRecognizing = false;
        let isSpeakingNow = false;
        let restartTimer = null;
        let lastCommandTime = 0;
        let lastHandledKey = "";

        function convertKoreanNumberToken(token) {
            if (!token) return "";
            if (/^\d+$/.test(token)) return String(parseInt(token, 10));

            const digitMap = {
                "영": 0, "공": 0, "일": 1, "이": 2, "삼": 3, "사": 4,
                "오": 5, "육": 6, "칠": 7, "팔": 8, "구": 9
            };

            let total = 0;
            let current = 0;
            let hasNumber = false;

            for (let i = 0; i < token.length; i++) {
                const ch = token[i];
                if (Object.prototype.hasOwnProperty.call(digitMap, ch)) {
                    current = digitMap[ch];
                    hasNumber = true;
                } else if (ch === "십") {
                    total += (current || 1) * 10;
                    current = 0;
                    hasNumber = true;
                } else if (ch === "백") {
                    total += (current || 1) * 100;
                    current = 0;
                    hasNumber = true;
                }
            }

            if (!hasNumber) return "";
            return String(total + current);
        }

        function normalizeKoreanSpeech(raw) {
            let s = (raw || "").trim().replace(/\s+/g, "");
            s = s.replace(/([영공일이삼사오육칠팔구십백]+)번/g, (_, numPart) => {
                const converted = convertKoreanNumberToken(numPart);
                return converted ? `${converted}번` : `${numPart}번`;
            });
            return s;
        }

        function shouldSkipDuplicate(commandKey, windowMs = 1800) {
            const now = Date.now();
            if (commandKey === lastHandledKey && (now - lastCommandTime) < windowMs) {
                return true;
            }
            lastHandledKey = commandKey;
            lastCommandTime = now;
            return false;
        }

        function directSendByNumber(rawNo, finishedState, rawTranscript) {
            const targetNo = String(parseInt(rawNo, 10));
            const found = markerList.find(item => String(item.no).trim() === targetNo);
            const actionName = finishedState ? "완료" : "취소";

            if (!found) {
                setStatusBanner(`"${rawTranscript}" 인식 → ${targetNo}번 마커를 찾을 수 없습니다.`, 'error');
                playBeep('error');
                return;
            }

            populateFormOnly(found);
            document.getElementById('finished').value = finishedState ? "true" : "false";
            setStatusBanner(`"${rawTranscript}" 인식 → ${found.no}번 ${actionName} 바로 전송 중...`, 'normal');

            sendToNotion({
                treeId: found.no,
                species: found.species,
                quantity: found.quantity,
                finished: finishedState
            });
        }

        function handleVoiceCommand(transcript) {
            const normalized = normalizeKoreanSpeech(transcript);

            const directCompleteMatch = normalized.match(/(\d+)\s*번?\s*(?:작업완료|완료)/);
            if (directCompleteMatch && directCompleteMatch[1]) {
                const targetNo = String(parseInt(directCompleteMatch[1], 10));
                if (shouldSkipDuplicate(`state:${targetNo}:done`)) return;
                directSendByNumber(targetNo, true, transcript);
                return;
            }

            const directCancelMatch = normalized.match(/(\d+)\s*번?\s*(?:작업취소|취소)/);
            if (directCancelMatch && directCancelMatch[1]) {
                const targetNo = String(parseInt(directCancelMatch[1], 10));
                if (shouldSkipDuplicate(`state:${targetNo}:cancel`)) return;
                directSendByNumber(targetNo, false, transcript);
                return;
            }

            if (/(?:^|[^가-힣])(?:작업완료|완료)(?:$|[^가-힣])/.test(normalized)) {
                const currentTreeId = document.getElementById('treeId').value;
                if (shouldSkipDuplicate(`state:${currentTreeId || 'none'}:done`)) return;
                if (!currentTreeId) {
                    setStatusBanner(`"${transcript}" 인식 → 번호를 함께 말하거나 먼저 선택해 주세요 (예: "14번 완료")`, 'normal');
                    return;
                }
                document.getElementById('finished').value = "true";
                setStatusBanner(`"${transcript}" 인식 → No.${currentTreeId} 완료 전송 중...`, 'normal');
                sendToNotion({ finished: true });
                return;
            }

            if (/(?:^|[^가-힣])(?:작업취소|취소)(?:$|[^가-힣])/.test(normalized)) {
                const currentTreeId = document.getElementById('treeId').value;
                if (shouldSkipDuplicate(`state:${currentTreeId || 'none'}:cancel`)) return;
                if (!currentTreeId) {
                    setStatusBanner(`"${transcript}" 인식 → 번호를 함께 말하거나 먼저 선택해 주세요`, 'normal');
                    return;
                }
                document.getElementById('finished').value = "false";
                setStatusBanner(`"${transcript}" 인식 → No.${currentTreeId} 취소 전송 중...`, 'normal');
                sendToNotion({ finished: false });
                return;
            }

            if (normalized.includes("남은주수") || normalized.includes("몇주남았")) {
                if (shouldSkipDuplicate("remain-qty")) return;
                const { remainingQty } = getQuantityStats();
                setStatusBanner(`잔여 ${remainingQty.toLocaleString()}주`, 'success');
                playBeep('info');
                return;
            }

            if (normalized.includes("깜빡임끄기") || normalized.includes("선택취소")) {
                if (shouldSkipDuplicate("stop-blink")) return;
                stopBlinking();
                setStatusBanner(`"${transcript}" 인식 → 마커 깜빡임 중지`, 'normal');
                return;
            }

            const numMatch = normalized.match(/(\d+)\s*번(?:\s*(?:시작|작업시작|클릭|선택))?/);
            if (numMatch && numMatch[1]) {
                const targetNo = String(parseInt(numMatch[1], 10));
                if (shouldSkipDuplicate(`select:${targetNo}`)) return;

                const found = markerList.find(item => String(item.no).trim() === targetNo);
                if (found) {
                    selectMarkerByItem(found);
                    const nextActionText = found.finished ? "완료됨 → '취소' 가능" : "미완료 → '완료' 가능";
                    setStatusBanner(`"${transcript}" 인식 → ${found.no}번 선택 (${nextActionText})`, 'success');
                    playBeep('info');
                } else {
                    setStatusBanner(`"${transcript}" 인식 → ${targetNo}번 마커를 찾을 수 없습니다.`, 'error');
                    playBeep('error');
                }
                return;
            }

            setStatusBanner(`인식됨: "${transcript}" (명령: "15번 시작", "완료", "14번 완료", "14번 취소")`, 'normal');
        }

        function safeStartRecognition() {
            if (!recognition || !isVoiceEnabled || isRecognizing || isSpeakingNow) return;
            try {
                recognition.start();
            } catch (e) {
                if (e && e.name === 'InvalidStateError') {
                    isRecognizing = true;
                } else {
                    console.error("음성 인식 시작 실패:", e);
                }
            }
        }

        function scheduleRecognitionRestart(delayMs = 250) {
            if (restartTimer) {
                clearTimeout(restartTimer);
                restartTimer = null;
            }
            if (!isVoiceEnabled || isRecognizing || isSpeakingNow) return;
            restartTimer = setTimeout(() => {
                safeStartRecognition();
            }, delayMs);
        }

        function initSpeechRecognition() {
            if (!SpeechRecognition) return null;
            const rec = new SpeechRecognition();
            rec.lang = 'ko-KR';
            rec.continuous = true;
            rec.interimResults = true;

            rec.onstart = () => {
                isRecognizing = true;
            };

            rec.onresult = (event) => {
                if (isSpeakingNow) return;
                let latestTranscript = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    latestTranscript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        handleVoiceCommand(latestTranscript);
                    } else {
                        setStatusBanner(`듣는 중: "${latestTranscript}"`, 'normal');
                    }
                }
            };

            rec.onerror = (event) => {
                isRecognizing = false;
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    isVoiceEnabled = false;
                    if (restartTimer) clearTimeout(restartTimer);
                    updateVoiceButtonUI();
                    setStatusBanner("마이크 권한이 차단되었습니다. 브라우저 주소창 자물쇠에서 마이크를 허용해 주세요.", 'error');
                } else if (event.error === 'audio-capture') {
                    isVoiceEnabled = false;
                    if (restartTimer) clearTimeout(restartTimer);
                    updateVoiceButtonUI();
                    setStatusBanner("마이크 장치를 찾을 수 없거나 다른 앱이 사용 중입니다.", 'error');
                } else if (event.error === 'network') {
                    setStatusBanner("네트워크 문제로 음성 인식이 일시 중단되었습니다. 재시도 중...", 'error');
                    scheduleRecognitionRestart(800);
                } else if (event.error !== 'no-speech' && event.error !== 'aborted') {
                    setStatusBanner(`음성 인식 상태: ${event.error} (재연결 시도 중)`, 'normal');
                    scheduleRecognitionRestart(400);
                }
            };

            rec.onend = () => {
                isRecognizing = false;
                if (isVoiceEnabled && !isSpeakingNow) {
                    scheduleRecognitionRestart(250);
                }
            };

            return rec;
        }

        function updateVoiceButtonUI() {
            const btn = document.getElementById('voice-btn');
            if (!btn) return;
            if (isVoiceEnabled) {
                btn.textContent = "🎙️ 음성 ON";
                btn.classList.add("listening");
            } else {
                btn.textContent = "🎙️ 음성 OFF";
                btn.classList.remove("listening");
            }
        }

        window.toggleVoiceRecognition = function() {
            ensureAudioContext();

            if (!SpeechRecognition) {
                alert("이 브라우저는 음성 인식(Web Speech API)을 지원하지 않습니다. Chrome 브라우저를 사용해 주세요.");
                return;
            }

            if (!recognition) {
                recognition = initSpeechRecognition();
            }

            if (!isVoiceEnabled) {
                isVoiceEnabled = true;
                updateVoiceButtonUI();
                setStatusBanner('마이크 켜짐 — "15번 시작" 후 "완료", "14번 완료", "14번 취소"라고 말씀해 주세요.', 'normal');
                safeStartRecognition();
            } else {
                isVoiceEnabled = false;
                if (restartTimer) {
                    clearTimeout(restartTimer);
                    restartTimer = null;
                }
                updateVoiceButtonUI();
                setStatusBanner("음성 인식이 꺼졌습니다.", 'normal');
                try {
                    recognition.stop();
                } catch (e) {}
            }
        };

        // 초기 레이아웃 재배치 및 중심좌표 고정
        setTimeout(() => {
            map.relayout();
            map.setCenter(initialCenter);
        }, 200);

        drawMarkers();
    </script>
</body>
</html>
