<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>아파트 수목조사용 지도 - 출력 방향 선택 및 뷰 사이즈 조절</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f9f9f9;
      margin: 0;
      padding: 2rem;
    }
    
    h2 {
      margin-bottom: 5px;
    }

    /* 🎛️ 지도 뷰 사이즈 조절 컨트롤러 영역 */
    .size-control-group {
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .size-control-group label {
      font-size: 0.95rem;
      font-weight: bold;
      color: #333;
    }
    .size-control-group select {
      padding: 6px 12px;
      font-size: 0.95rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      background-color: #fff;
      cursor: pointer;
    }

    /* 화면 기본 지도 크기 (동적으로 변경됨) */
    #map-container {
      width: 1200px;
      height: 800px;
      margin: 0 auto;
      border: 2px solid #333;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      background: #ffffff;
      position: relative;
      overflow: hidden;
      transition: width 0.3s ease, height 0.3s ease; /* 부드러운 사이즈 변경 효과 */
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 버튼 컨트롤 영역 */
    .btn-group {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .action-btn {
      padding: 12px 24px;
      font-size: 1.05rem;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .action-btn:hover {
      background-color: #45a049;
    }

    .landscape-btn {
      background-color: #2196F3;
    }
    .landscape-btn:hover {
      background-color: #0b7dda;
    }

    p {
      color: #555;
      margin-top: 10px;
    }

    /* 🖨️ 기본 인쇄 공통 스타일 */
    @media print {
      html, body {
        width: 100%;
        height: 100%;
        margin: 0 !important;
        padding: 0 !important;
        background: white;
      }

      /* 지도 외 화면 UI 숨김 (타이틀, 사이즈 조절바, 버튼 등) */
      h2, .size-control-group, .btn-group, p {
        display: none !important;
      }

      /* 인쇄 시 지도 영역을 용지에 딱 맞게 보정 */
      #map-container {
        width: 100vw !important;
        height: 100vh !important;
        max-width: none !important;
        max-height: none !important;
        border: none !important;
        box-shadow: none !important;
        margin: 0 !important;
        border-radius: 0 !important;
      }

      #map {
        width: 100% !important;
        height: 100% !important;
      }
    }
  </style>

  <!-- 인쇄 방향을 동적으로 결정하는 CSS 태그 -->
  <style id="print-orientation-style">
    @page {
      size: A4 portrait;
      margin: 0;
    }
  </style>
</head>
<body>

  <h2>📍 아파트 수목조사용 지도</h2>

  <!-- 📐 지도 View 사이즈 조절 UI 추가 -->
  <div class="size-control-group">
    <label for="mapSizePreset">🔍 지도 뷰 사이즈 조절:</label>
    <select id="mapSizePreset" onchange="changeMapSize(this.value)">
      <option value="1200x800">기본 (1200 × 800)</option>
      <option value="1000x600">중형 (1000 × 600)</option>
      <option value="800x500">소형 (800 × 500)</option>
      <option value="1400x900">대형 (1400 × 900)</option>
      <option value="fullscreen">화면 꽉 채우기 (Full)</option>
    </select>
  </div>
  
  <div id="map-container">
    <div id="map"></div>
  </div>

  <div class="btn-group">
    <button class="action-btn" onclick="printMap('portrait')">📱 세로 방향 인쇄 / PDF</button>
    <button class="action-btn landscape-btn" onclick="printMap('landscape')">🖥️ 가로 방향 인쇄 / PDF</button>
  </div>
  <p>원하시는 출력 방향 버튼을 누르시면, 잘림 없이 한 페이지에 지도 전체가 꽉 차도록 자동 조절됩니다.</p>

  <!-- ✅ 카카오맵 JS SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4010951d8779c420a474f095fd26c0a6"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const centerLat = parseFloat(params.get("centerLat")) || 37.5665;
    const centerLng = parseFloat(params.get("centerLng")) || 126.9780;
    const level = parseInt(params.get("level")) || 3;

    const container = document.getElementById('map');
    const options = {
      center: new kakao.maps.LatLng(centerLat, centerLng),
      level: level
    };

    const map = new kakao.maps.Map(container, options);

    // 현장 중심 마커
    const markerPosition = new kakao.maps.LatLng(centerLat, centerLng);
    const marker = new kakao.maps.Marker({
      position: markerPosition
    });
    marker.setMap(map);

    // 📐 지도 View 사이즈 변경 함수
    function changeMapSize(preset) {
      const mapContainer = document.getElementById('map-container');

      if (preset === 'fullscreen') {
        mapContainer.style.width = '100%';
        mapContainer.style.height = '85vh';
      } else {
        const [w, h] = preset.split('x');
        mapContainer.style.width = w + 'px';
        mapContainer.style.height = h + 'px';
      }

      // 사이즈 변경 후 카카오맵 레이아웃 재계산 및 중심 맞춤
      setTimeout(() => {
        map.relayout();
        map.setCenter(new kakao.maps.LatLng(centerLat, centerLng));
      }, 300);
    }

    // 🖨️ 가로/세로 방향 선택 인쇄 처리 함수
    function printMap(orientation) {
      const styleTag = document.getElementById('print-orientation-style');
      
      if (orientation === 'landscape') {
        // 가로 방향 인쇄 설정
        styleTag.innerHTML = `@page { size: A4 landscape; margin: 0; }`;
      } else {
        // 세로 방향 인쇄 설정
        styleTag.innerHTML = `@page { size: A4 portrait; margin: 0; }`;
      }

      // 1. 변경된 인쇄 크기에 맞춰 카카오맵 중심 좌표 및 타일 레이아웃 재정렬
      map.relayout();
      map.setCenter(new kakao.maps.LatLng(centerLat, centerLng));

      // 2. 레이아웃 재배치가 완료된 후 인쇄 창 실행
      setTimeout(() => {
        window.print();
      }, 300);
    }

    // Ctrl+P 등 단축키로 기본 인쇄 시 지도 레이아웃 깨짐 방지
    window.onbeforeprint = function() {
      map.relayout();
      map.setCenter(new kakao.maps.LatLng(centerLat, centerLng));
    };
  </script>
</body>
</html>
