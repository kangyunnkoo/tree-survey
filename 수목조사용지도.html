<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>아파트 수목조사용 지도 - 정밀 뷰 인쇄 지원</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f9f9f9;
      margin: 0;
      padding: 1.5rem;
    }
    
    h2 {
      margin-bottom: 5px;
    }

    /* 🎛️ 지도 뷰 사이즈 조절 및 커스텀 입력 컨트롤러 영역 */
    .size-control-group {
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .size-control-group label {
      font-size: 0.95rem;
      font-weight: bold;
      color: #333;
    }
    .size-control-group select, .size-control-group input {
      padding: 6px 10px;
      font-size: 0.95rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      background-color: #fff;
    }
    .size-control-group input {
      width: 70px;
      text-align: center;
    }
    .apply-btn {
      padding: 6px 12px;
      font-size: 0.9rem;
      background-color: #607D8B;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .apply-btn:hover {
      background-color: #455A64;
    }

    /* 화면 기본 지도 크기 (동적으로 변경됨) */
    #map-container {
      width: 1200px;
      height: 800px;
      margin: 0 auto;
      border: 2px solid #333;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      background: #ffffff;
      position: relative;
      overflow: hidden;
      transition: width 0.2s ease, height 0.2s ease;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 버튼 컨트롤 영역 */
    .btn-group {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .action-btn {
      padding: 12px 24px;
      font-size: 1.05rem;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .action-btn:hover {
      background-color: #45a049;
    }

    .landscape-btn {
      background-color: #2196F3;
    }
    .landscape-btn:hover {
      background-color: #0b7dda;
    }

    p {
      color: #555;
      margin-top: 10px;
    }

    /* 🖨️ 인쇄 시 페이지가 지도 크기에 딱 맞도록 강제 설정 */
    @media print {
      @page {
        margin: 0;
      }
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: white;
      }
      /* 인쇄 모드 진입 시 body 안의 모든 요소를 숨기고 오직 인쇄용 래퍼만 표시 */
      body > *:not(#print-wrapper) {
        display: none !important;
      }
      #print-wrapper {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        border: none;
        box-shadow: none;
      }
      #print-wrapper #map {
        width: 100% !important;
        height: 100% !important;
      }
    }
  </style>

  <!-- 인쇄 방향을 동적으로 결정하는 CSS 태그 -->
  <style id="print-orientation-style">
    @page {
      size: A4 portrait;
      margin: 0;
    }
  </style>
</head>
<body>

  <h2>📍 아파트 수목조사용 지도</h2>

  <!-- 📐 지도 View 사이즈 선택 및 커스텀 입력 UI -->
  <div class="size-control-group">
    <label for="mapSizePreset">🔍 뷰 프리셋:</label>
    <select id="mapSizePreset" onchange="handlePresetChange(this.value)">
      <option value="1200x800">기본 (1200 × 800)</option>
      <option value="1000x600">중형 (1000 × 600)</option>
      <option value="800x500">소형 (800 × 500)</option>
      <option value="1400x900">대형 (1400 × 900)</option>
      <option value="custom" selected>커스텀 직접 입력</option>
    </select>

    <label for="customWidth" style="margin-left: 10px;">가로(px):</label>
    <input type="number" id="customWidth" value="1200" min="400" max="3000">

    <label for="customHeight">세로(px):</label>
    <input type="number" id="customHeight" value="800" min="300" max="3000">

    <button class="apply-btn" onclick="applyCustomSize()">크기 적용</button>
  </div>
  
  <!-- 인쇄 시 격리하여 출력하기 위한 인쇄 래퍼 -->
  <div id="print-wrapper">
    <div id="map-container">
      <div id="map"></div>
    </div>
  </div>

  <div class="btn-group">
    <button class="action-btn" onclick="printMap('portrait')">📱 세로 방향 인쇄 / PDF</button>
    <button class="action-btn landscape-btn" onclick="printMap('landscape')">🖥️ 가로 방향 인쇄 / PDF</button>
  </div>
  <p>원하시는 출력 방향 버튼을 누르시면, 뷰 영역 내의 지도만 정확하게 인쇄 대상이 됩니다.</p>

  <!-- ✅ 카카오맵 JS SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4010951d8779c420a474f095fd26c0a6"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const centerLat = parseFloat(params.get("centerLat")) || 37.5665;
    const centerLng = parseFloat(params.get("centerLng")) || 126.9780;
    const level = parseInt(params.get("level")) || 3;

    const container = document.getElementById('map');
    const options = {
      center: new kakao.maps.LatLng(centerLat, centerLng),
      level: level
    };

    const map = new kakao.maps.Map(container, options);

    // 현장 중심 마커
    const markerPosition = new kakao.maps.LatLng(centerLat, centerLng);
    const marker = new kakao.maps.Marker({
      position: markerPosition
    });
    marker.setMap(map);

    // 📐 프리셋 변경 시 입력창 값 연동
    function handlePresetChange(value) {
      if (value === 'custom') return;
      const [w, h] = value.split('x');
      document.getElementById('customWidth').value = w;
      document.getElementById('customHeight').value = h;
      applySize(w, h);
    }

    // 📐 커스텀 크기 적용 버튼 클릭 시
    function applyCustomSize() {
      const w = document.getElementById('customWidth').value;
      const h = document.getElementById('customHeight').value;
      applySize(w, h);
    }

    // 공통 사이즈 적용 및 맵 갱신 함수
    function applySize(w, h) {
      const mapContainer = document.getElementById('map-container');
      mapContainer.style.width = w + 'px';
      mapContainer.style.height = h + 'px';

      setTimeout(() => {
        map.relayout();
        map.setCenter(new kakao.maps.LatLng(centerLat, centerLng));
      }, 200);
    }

    // 🖨️ 가로/세로 방향 선택 인쇄 처리 함수
    function printMap(orientation) {
      const styleTag = document.getElementById('print-orientation-style');
      
      if (orientation === 'landscape') {
        styleTag.innerHTML = `@page { size: A4 landscape; margin: 0; }`;
      } else {
        styleTag.innerHTML = `@page { size: A4 portrait; margin: 0; }`;
      }

      // 인쇄 전 맵 레이아웃 최신화
      map.relayout();
      map.setCenter(new kakao.maps.LatLng(centerLat, centerLng));

      setTimeout(() => {
        window.print();
      }, 300);
    }
  </script>
</body>
</html>
