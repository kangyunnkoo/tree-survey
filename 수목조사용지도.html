<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>수목 현장 조사 - 지도 사이즈 조절 기능 포함</title>
    <style>
        html, body { margin:0; padding:0; height:100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #map-wrapper {
            width: 100%;
            height: 72%; /* 초기 지도 비율 (드래그로 변경 가능) */
            overflow: hidden;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
            transition: transform 0.2s ease-in-out;
        }

        #map.zoomed {
            width: 50%;
            height: 50%;
            transform: scale(2);
        }

        #zoom-toggle-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            background: #ffffff;
            color: #333333;
            border: 1px solid #cccccc;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            user-select: none;
        }
        #zoom-toggle-btn.active {
            background: #007bff;
            color: #ffffff;
            border-color: #0056b3;
        }

        /* 오른쪽 중앙 나침반 토글 버튼 스타일 */
        #compass-btn {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            z-index: 10;
            background: #ffffff;
            color: #1c7ed6;
            border: 2px solid #1c7ed6;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
            user-select: none;
            transition: background-color 0.2s, color 0.2s;
        }
        #compass-btn.active {
            background: #1c7ed6;
            color: #ffffff;
        }

        /* 수목 저장 완료된 원번호 마커 (초록색) */
        .number-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            background-color: #2b8a3e;
            color: #ffffff;
            font-size: 9px;
            font-weight: bold;
            border-radius: 50%;
            border: 1.5px solid #ffffff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
            cursor: pointer;
            user-select: none;
            line-height: 1;
        }
        .number-badge:active { transform: scale(1.2); }

        /* 내 위치 실시간 방향 화살표 마커 (파란색) */
        .my-location-badge {
            width: 14px;
            height: 14px;
            background-color: #1c7ed6;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .my-location-badge::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 7px solid #ffffff;
            position: absolute;
            top: -5px;
        }

        #panel {
            flex: 1; /* 남은 영역을 채움 */
            background: #ffffff;
            border-top: 1px solid #ccc;
            box-sizing: border-box;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #panel.collapsed { height: 36px; flex: none; }

        /* 📐 지도와 패널 사이의 드래그 조절바 스타일 */
        #resizer {
            height: 10px;
            background: #e9ecef;
            border-top: 1px solid #dee2e6;
            border-bottom: 1px solid #dee2e6;
            cursor: row-resize;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            user-select: none;
        }
        /* 조절바 핸들바 아이콘 표시 */
        #resizer::after {
            content: '•••';
            color: #adb5bd;
            font-size: 10px;
            letter-spacing: 2px;
            margin-top: -3px;
        }
        #resizer:hover, #resizer.dragging {
            background: #ced4da;
        }

        #panel-toggle-bar {
            height: 36px;
            background: #f1f3f5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 13px;
            font-weight: bold;
            color: #495057;
            cursor: pointer;
            border-bottom: 1px solid #dee2e6;
            user-select: none;
        }

        #panel-body {
            flex: 1;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        #panel.collapsed #panel-body { display: none; }

        .input-row { display: flex; gap: 6px; }
        .combo-box { display: flex; flex: 1.2; gap: 3px; }

        input, select { 
            width: 100%; height: 40px; font-size: 14px; 
            border-radius: 6px; border: 1px solid #ddd; box-sizing: border-box; padding: 0 8px;
        }
        input[readonly] { background-color: #f5f5f5; color: #666; height: 34px; font-size: 12px; }

        .select-quick {
            width: 38px; min-width: 38px; padding: 0 2px; text-align: center;
            background-color: #f8f9fa; border-color: #ced4da; cursor: pointer;
        }

        .btn-send { 
            width: 100%; height: 40px; font-size: 15px;
            background-color: #2b8a3e; color: white; font-weight: bold; 
            border: none; border-radius: 6px; cursor: pointer;
        }
        .btn-send:disabled { background-color: #82c91e; cursor: not-allowed; }

        #last-sent-box {
            padding: 4px 8px;
            background-color: #f0fdf4;
            border: 1px solid #2b8a3e;
            border-radius: 6px;
            font-size: 11px;
            color: #222;
            display: none;
        }
        .last-sent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-resend {
            background-color: #e03131; color: white; font-size: 10px; font-weight: bold;
            border: none; border-radius: 3px; padding: 1px 5px; cursor: pointer; width: auto; height: auto;
        }
    </style>
    <!-- 카카오맵 JS SDK -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4010951d8779c420a474f095fd26c0a6&autoload=false"></script>
</head>
<body>
    <div id="map-wrapper">
        <button id="zoom-toggle-btn">🔍 2배 확대 ON/OFF</button>
        <!-- 오른쪽 중앙 나침반 방향 토글 버튼 -->
        <button id="compass-btn" onclick="toggleCompassMode()" title="실시간 시선 방향 및 위치 표시 토글">🧭</button>
        <div id="map"></div>
    </div>
    
    <!-- 📐 크기 조절바 추가 -->
    <div id="resizer"></div>

    <div id="panel" class="">
        <div id="panel-toggle-bar" onclick="togglePanel()">
            <span>🌳 수목 조사 입력폼</span>
            <span id="toggle-arrow">▲ 폼 숨기기</span>
        </div>

        <div id="panel-body">
            <!-- 1행: 번호 + 수종 -->
            <div class="input-row">
                <input type="text" id="treeId" placeholder="번호 (예: 101)" style="flex: 0.8;">
                <div class="combo-box">
                    <input type="text" id="species" placeholder="수종 직접 입력">
                    <select id="species-select" class="select-quick" onchange="applyQuickValue('species', this)">
                        <option value="">▼</option>
                    </select>
                </div>
            </div>

            <!-- 2행: 주수 + 상태 -->
            <div class="input-row">
                <input type="number" id="quantity" placeholder="주수 (예: 1)" style="flex: 0.8;">
                <div class="combo-box">
                    <input type="text" id="status" placeholder="상태 직접 입력">
                    <select id="status-select" class="select-quick" onchange="applyQuickValue('status', this)">
                        <option value="">▼</option>
                    </select>
                </div>
            </div>

            <input type="text" id="coords" readonly placeholder="지도를 터치하여 위치를 지정하세요">
            <button id="sendBtn" class="btn-send" onclick="sendToNotion()">노션 DB로 전송</button>

            <div id="last-sent-box">
                <div class="last-sent-header">
                    <strong id="status-title" style="color: #2b8a3e;">[선택 정보]</strong>
                    <span id="last-sent-info">-</span>
                    <button class="btn-resend" onclick="resendToNotion()">↻ 재전송</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        kakao.maps.load(function() {
            const params = new URLSearchParams(window.location.search);
            const masterId = params.get("master_id") || "";
            const centerLat = parseFloat(params.get("lat")) || 37.5794;
            const centerLng = parseFloat(params.get("lng")) || 126.9033;
            
            const mapContainer = document.getElementById('map');
            const mapOptions = { 
                center: new kakao.maps.LatLng(centerLat, centerLng), 
                level: 1 
            };
            const map = new kakao.maps.Map(mapContainer, mapOptions);

            let activeMarker = null; 
            let myLocationOverlay = null; 
            let myLocationEl = null;
            let selectedCoords = null;
            let isZoomed = false;

            let isDragging = false;
            let startX = 0, startY = 0;
            
            let isCompassActive = false;
            let watchId = null;

            const zoomBtn = document.getElementById("zoom-toggle-btn");
            const compassBtn = document.getElementById("compass-btn");
            const mapWrapper = document.getElementById("map-wrapper");
            const resizer = document.getElementById("resizer");
            const panel = document.getElementById("panel");
            const webhookUrl = "https://hook.eu2.make.com/by8xkdrp85r5m6pu9f6vq7bj5f81yhr1";
            let lastPayload = null;

            // 📐 마우스 및 터치 드래그로 지도 크기 조절 기능 구현
            let isResizing = false;

            resizer.addEventListener('mousedown', function(e) {
                isResizing = true;
                resizer.classList.add('dragging');
                e.preventDefault();
            });

            resizer.addEventListener('touchstart', function(e) {
                isResizing = true;
                resizer.classList.add('dragging');
            }, { passive: false });

            window.addEventListener('mousemove', function(e) {
                if (!isResizing) return;
                handleResize(e.clientY);
            });

            window.addEventListener('touchmove', function(e) {
                if (!isResizing) return;
                if (e.touches.length > 0) {
                    handleResize(e.touches[0].clientY);
                }
            }, { passive: false });

            window.addEventListener('mouseup', function() {
                stopResize();
            });

            window.addEventListener('touchend', function() {
                stopResize();
            });

            function handleResize(clientY) {
                const totalHeight = window.innerHeight;
                let newMapHeight = clientY;
                
                // 최소/최대 제한 (지도 최소 150px, 최대 전체화면의 85% 제한)
                if (newMapHeight < 150) newMapHeight = 150;
                if (newMapHeight > totalHeight * 0.85) newMapHeight = totalHeight * 0.85;

                mapWrapper.style.height = newMapHeight + 'px';
                map.relayout();
            }

            function stopResize() {
                if (isResizing) {
                    isResizing = false;
                    resizer.classList.remove('dragging');
                    map.relayout();
                }
            }

            function updateMyLocation(lat, lng, heading) {
                const locPosition = new kakao.maps.LatLng(lat, lng);

                if (!myLocationOverlay) {
                    myLocationEl = document.createElement('div');
                    myLocationEl.className = 'my-location-badge';

                    myLocationOverlay = new kakao.maps.CustomOverlay({
                        position: locPosition,
                        content: myLocationEl,
                        xAnchor: 0.5,
                        yAnchor: 0.5,
                        zIndex: 5
                    });
                    myLocationOverlay.setMap(map);
                } else {
                    myLocationOverlay.setPosition(locPosition);
                }

                if (heading !== null && !isNaN(heading) && myLocationEl) {
                    myLocationEl.style.transform = `rotate(${heading}deg)`;
                }
            }

            window.toggleCompassMode = function() {
                isCompassActive = !isCompassActive;

                if (isCompassActive) {
                    compassBtn.classList.add("active");
                    
                    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                        DeviceOrientationEvent.requestPermission().then(response => {
                            if (response === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation, true);
                            }
                        }).catch(console.error);
                    } else if (window.DeviceOrientationEvent) {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                    }

                    if (navigator.geolocation) {
                        watchId = navigator.geolocation.watchPosition(function(position) {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;
                            updateMyLocation(lat, lng, null);
                            map.setCenter(new kakao.maps.LatLng(lat, lng));
                        }, null, { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
                    }
                } else {
                    compassBtn.classList.remove("active");

                    if (watchId !== null) {
                        navigator.geolocation.clearWatch(watchId);
                        watchId = null;
                    }
                    if (window.DeviceOrientationEvent) {
                        window.removeEventListener('deviceorientation', handleOrientation, true);
                    }

                    if (myLocationOverlay) {
                        myLocationOverlay.setMap(null);
                        myLocationOverlay = null;
                        myLocationEl = null;
                    }
                }
            };

            function handleOrientation(event) {
                let heading = null;
                if (event.webkitCompassHeading) {
                    heading = event.webkitCompassHeading;
                } else if (event.alpha) {
                    heading = 360 - event.alpha;
                }

                if (heading !== null && myLocationEl) {
                    myLocationEl.style.transform = `rotate(${heading}deg)`;
                }
            }

            window.togglePanel = function() {
                const toggleArrow = document.getElementById('toggle-arrow');
                
                panel.classList.toggle('collapsed');
                if (panel.classList.contains('collapsed')) {
                    toggleArrow.textContent = "▼ 폼 펼치기";
                    mapWrapper.style.height = "calc(100% - 36px - 10px)";
                } else {
                    toggleArrow.textContent = "▲ 폼 숨기기";
                    mapWrapper.style.height = "72%";
                }
                setTimeout(() => { map.relayout(); }, 200);
            };

            zoomBtn.addEventListener("click", function() {
                isZoomed = !isZoomed;
                const currentCenter = map.getCenter();
                
                if (isZoomed) {
                    mapContainer.classList.add("zoomed");
                    zoomBtn.classList.add("active");
                    zoomBtn.textContent = "🔍 2배 확대 [켜짐]";
                } else {
                    mapContainer.classList.remove("zoomed");
                    zoomBtn.classList.remove("active");
                    zoomBtn.textContent = "🔍 2배 확대 ON/OFF";
                }

                setTimeout(() => {
                    map.relayout();
                    map.setCenter(currentCenter);
                }, 200);
            });

            window.applyQuickValue = function(fieldId, selectObj) {
                if (selectObj.value) {
                    document.getElementById(fieldId).value = selectObj.value;
                    selectObj.value = "";
                }
            };

            function learnNewOptions(species, status) {
                if (species) addOptionIfNotExists('species-select', species);
                if (status) addOptionIfNotExists('status-select', status);
            }

            function addOptionIfNotExists(selectId, value) {
                const selectElem = document.getElementById(selectId);
                let exists = false;
                for (let i = 0; i < selectElem.options.length; i++) {
                    if (selectElem.options[i].value === value) {
                        exists = true;
                        break;
                    }
                }
                if (!exists) {
                    const opt = document.createElement('option');
                    opt.value = value;
                    opt.text = value;
                    selectElem.appendChild(opt);
                }
            }

            mapWrapper.addEventListener('mousedown', function(e) {
                isDragging = false; startX = e.clientX; startY = e.clientY;
            });
            mapWrapper.addEventListener('mousemove', function(e) {
                if (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5) isDragging = true;
            });
            mapWrapper.addEventListener('touchstart', function(e) {
                if (e.touches.length > 0) {
                    isDragging = false; startX = e.touches[0].clientX; startY = e.touches[0].clientY;
                }
            });
            mapWrapper.addEventListener('touchmove', function(e) {
                if (e.touches.length > 0) {
                    if (Math.abs(e.touches[0].clientX - startX) > 5 || Math.abs(e.touches[0].clientY - startY) > 5) isDragging = true;
                }
            });

            mapContainer.addEventListener('click', function(e) {
                if (isDragging) { isDragging = false; return; }

                const rect = mapContainer.getBoundingClientRect();
                let clickX = e.clientX - rect.left;
                let clickY = e.clientY - rect.top;

                if (isZoomed) {
                    clickX = clickX / 2;
                    clickY = clickY / 2;
                }

                const projection = map.getProjection();
                if (!projection) return;

                const point = new kakao.maps.Point(clickX, clickY);
                const latlng = projection.coordsFromContainerPoint(point);

                if (latlng) {
                    selectedCoords = { lat: latlng.getLat(), lng: latlng.getLng() };
                    
                    if (!activeMarker) {
                        activeMarker = new kakao.maps.Marker({ position: latlng, map: map });
                    } else {
                        activeMarker.setPosition(latlng);
                        if (!activeMarker.getMap()) activeMarker.setMap(map);
                    }

                    document.getElementById("coords").value = `선택 좌표: ${selectedCoords.lat.toFixed(6)}, ${selectedCoords.lng.toFixed(6)}`;
                }
            });

            window.sendToNotion = function() {
                const treeId = document.getElementById('treeId').value;
                const quantity = document.getElementById('quantity').value;
                const species = document.getElementById('species').value;
                const status = document.getElementById('status').value;

                if (!selectedCoords || !treeId) {
                    alert('지도를 터치하여 위치를 선택하고 수목 번호를 입력해 주세요.');
                    return;
                }

                lastPayload = {
                    master_id: masterId,
                    tree_id: treeId,
                    quantity: quantity ? parseInt(quantity) : 1,
                    species: species,
                    status: status,
                    lat: selectedCoords.lat,
                    lng: selectedCoords.lng
                };

                executeFetch(lastPayload);
            };

            function executeFetch(payload) {
                const sendBtn = document.getElementById('sendBtn');
                sendBtn.disabled = true;
                sendBtn.innerText = "노션 저장 확인 중...";

                fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(response => {
                    if (!response.ok) throw new Error('서버 응답 오류 (' + response.status + ')');
                    return response.json();
                })
                .then(data => {
                    if (data && data.status === "success") {
                        alert('노션 DB에 정상적으로 데이터가 입력되었습니다!');
                        
                        createCircleNumberMarker(payload);
                        learnNewOptions(payload.species, payload.status);

                        if (activeMarker) {
                            activeMarker.setMap(null);
                            activeMarker = null;
                        }

                        updateDisplayBox(payload, true, '[저장 성공]');

                        document.getElementById('treeId').value = '';
                        document.getElementById('quantity').value = '';
                        document.getElementById('species').value = '';
                        document.getElementById('status').value = '';
                        document.getElementById('coords').value = '';
                        selectedCoords = null;
                    } else {
                        throw new Error('노션 DB 입력 처리 실패');
                    }
                })
                .catch(error => {
                    alert('⚠️ [경고] 노션 저장에 실패했습니다!\n' + error.message + '\n하단의 [재전송] 버튼을 이용해 주세요.');
                    updateDisplayBox(payload, false, '[저장 실패]');
                })
                .finally(() => {
                    sendBtn.disabled = false;
                    sendBtn.innerText = "노션 DB로 전송";
                });
            }

            function createCircleNumberMarker(payload) {
                const position = new kakao.maps.LatLng(payload.lat, payload.lng);

                const content = document.createElement('div');
                content.className = 'number-badge';
                content.innerText = payload.tree_id;

                const customOverlay = new kakao.maps.CustomOverlay({
                    position: position,
                    content: content,
                    xAnchor: 0.5,
                    yAnchor: 0.5,
                    zIndex: 3
                });
                customOverlay.setMap(map);

                function handleOverlayClick(e) {
                    if (e) {
                        if (e.stopPropagation) e.stopPropagation();
                        if (e.preventDefault) e.preventDefault();
                    }
                    lastPayload = payload;
                    updateDisplayBox(payload, true, `[No. ${payload.tree_id} 조회]`);
                }

                content.addEventListener('click', handleOverlayClick);
                content.addEventListener('touchend', handleOverlayClick);
                content.addEventListener('mousedown', function(e) { e.stopPropagation(); });
                content.addEventListener('touchstart', function(e) { e.stopPropagation(); });
            }

            function updateDisplayBox(payload, isSuccess, titleText) {
                const displayBox = document.getElementById('last-sent-box');
                const statusTitle = document.getElementById('status-title');
                const displayInfo = document.getElementById('last-sent-info');

                if (isSuccess) {
                    displayBox.style.backgroundColor = '#f0fdf4';
                    displayBox.style.borderColor = '#2b8a3e';
                    statusTitle.style.color = '#2b8a3e';
                } else {
                    displayBox.style.backgroundColor = '#fff5f5';
                    displayBox.style.borderColor = '#e03131';
                    statusTitle.style.color = '#e03131';
                }

                statusTitle.innerText = titleText || '[선택 정보]';
                displayInfo.innerHTML = `No.<b>${payload.tree_id}</b> (${payload.species || '-'}/${payload.quantity}주/${payload.status || '-'})`;
                displayBox.style.display = 'block';
            }

            window.resendToNotion = function() {
                const lastPayloadObj = lastPayload;
                if (!lastPayloadObj) {
                    alert('재전송 또는 조회할 최근 정보가 없습니다.');
                    return;
                }
                executeFetch(lastPayloadObj);
            };
        });
    </script>
</body>
</html>
