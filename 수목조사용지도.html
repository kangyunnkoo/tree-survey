<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>아파트 수목조사용 지도 출력 및 캡처</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f9f9f9;
      margin: 0;
      padding: 2rem;
    }
    
    h2 {
      margin-bottom: 10px;
    }

    /* 지도 출력 영역 */
    #map-container {
      width: 1200px;
      height: 900px;
      margin: 0 auto;
      border: 2px solid #333;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .btn-group {
      margin-top: 20px;
    }

    .action-btn {
      padding: 12px 24px;
      font-size: 1.1rem;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin: 0 5px;
    }
    .action-btn:hover {
      background-color: #45a049;
    }

    p {
      color: #555;
      margin-top: 10px;
    }

    /* 인쇄(프린트/PDF 저장) 전용 스타일: 지도 외 불필요한 요소 숨김 및 여백 최적화 */
    @media print {
      body {
        background: white;
        padding: 0;
        margin: 0;
      }
      h2, .btn-group, p {
        display: none !important;
      }
      #map-container {
        width: 100% !important;
        height: 100vh !important;
        border: none !important;
        box-shadow: none !important;
        margin: 0 !important;
        border-radius: 0 !important;
      }
    }
  </style>
</head>
<body>

  <h2>📍 아파트 수목조사용 지도</h2>
  
  <div id="map-container">
    <div id="map"></div>
  </div>

  <div class="btn-group">
    <!-- html2canvas 대신 브라우저의 고품질 인쇄/PDF 저장 기능을 활용합니다 -->
    <button class="action-btn" onclick="window.print()">🖨️ 지도 인쇄 및 PDF 저장하기</button>
  </div>
  <p><b>인쇄 및 PDF 저장하기</b>를 누른 후, 프린터 대상에서 <b>'PDF로 저장'</b>을 선택하시면 가장 깨끗한 고화질 이미지/문서로 저장됩니다.</p>

  <!-- ✅ 카카오맵 JS SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4010951d8779c420a474f095fd26c0a6"></script>

  <script>
    // URL 파라미터 파싱 (기본값: 서울시청, 현장 환경에 맞춰 위경도 전달 가능)
    const params = new URLSearchParams(window.location.search);
    const centerLat = parseFloat(params.get("centerLat")) || 37.5665;
    const centerLng = parseFloat(params.get("centerLng")) || 126.9780;
    const level = parseInt(params.get("level")) || 3;

    // 카카오맵 생성 옵션
    const container = document.getElementById('map');
    const options = {
      center: new kakao.maps.LatLng(centerLat, centerLng),
      level: level
    };

    // 카카오 동적 지도 생성
    const map = new kakao.maps.Map(container, options);

    // 현장 중심 마커 표시
    const markerPosition = new kakao.maps.LatLng(centerLat, centerLng);
    const marker = new kakao.maps.Marker({
      position: markerPosition
    });
    marker.setMap(map);
  </script>
</body>
</html>
