<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>아파트 수목조사용 지도 - 세로 출력 최적화</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f9f9f9;
      margin: 0;
      padding: 2rem;
    }
    
    h2 {
      margin-bottom: 10px;
    }

    /* 화면용 지도 영역 */
    #map-container {
      width: 1200px;
      height: 900px;
      margin: 0 auto;
      border: 2px solid #333;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      background: #ffffff;
      position: relative;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .btn-group {
      margin-top: 20px;
    }

    .action-btn {
      padding: 12px 24px;
      font-size: 1.1rem;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin: 0 5px;
    }
    .action-btn:hover {
      background-color: #45a049;
    }

    p {
      color: #555;
      margin-top: 10px;
    }

    /* 🖨️ 세로(Portrait) 인쇄 전용 CSS */
    @page {
      size: A4 portrait; /* A4 용지 세로 방향 설정 */
      margin: 0;         /* 인쇄 여백 제거하여 지도 영역 극대화 */
    }

    @media print {
      html, body {
        width: 100%;
        height: 100%;
        margin: 0 !important;
        padding: 0 !important;
        background: white;
      }

      /* 지도 이외의 UI 요소 숨기기 */
      h2, .btn-group, p {
        display: none !important;
      }

      /* 세로 A4 한 페이지에 잘림 없이 꽉 차도록 설정 */
      #map-container {
        width: 100vw !important;
        height: 100vh !important;
        max-width: none !important;
        max-height: none !important;
        border: none !important;
        box-shadow: none !important;
        margin: 0 !important;
        border-radius: 0 !important;
      }

      #map {
        width: 100% !important;
        height: 100% !important;
      }
    }
  </style>
</head>
<body>

  <h2>📍 아파트 수목조사용 지도 (세로 출력)</h2>
  
  <div id="map-container">
    <div id="map"></div>
  </div>

  <div class="btn-group">
    <button class="action-btn" onclick="printMap()">🖨️ 세로 지도 인쇄 / PDF 저장</button>
  </div>
  <p>버튼을 누르면 세로 방향 A4 사이즈로 지도가 잘림 없이 깔끔하게 출력됩니다.</p>

  <!-- ✅ 카카오맵 JS SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4010951d8779c420a474f095fd26c0a6"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const centerLat = parseFloat(params.get("centerLat")) || 37.5665;
    const centerLng = parseFloat(params.get("centerLng")) || 126.9780;
    const level = parseInt(params.get("level")) || 3;

    const container = document.getElementById('map');
    const options = {
      center: new kakao.maps.LatLng(centerLat, centerLng),
      level: level
    };

    const map = new kakao.maps.Map(container, options);

    // 마커 추가
    const markerPosition = new kakao.maps.LatLng(centerLat, centerLng);
    const marker = new kakao.maps.Marker({
      position: markerPosition
    });
    marker.setMap(map);

    // 인쇄 실행 함수 (인쇄 직전 레이아웃 재정렬을 수행하여 잘림 방지)
    function printMap() {
      // 1. 인쇄 레이아웃에 맞춰 지도 재계산
      map.relayout();
      map.setCenter(new kakao.maps.LatLng(centerLat, centerLng));
      
      // 2. 인쇄 실행
      setTimeout(() => {
        window.print();
      }, 300);
    }

    // 브라우저 기본 인쇄(Ctrl+P) 시에도 지도 레이아웃 재정렬 처리
    window.onbeforeprint = function() {
      map.relayout();
      map.setCenter(new kakao.maps.LatLng(centerLat, centerLng));
    };
  </script>
</body>
</html>
