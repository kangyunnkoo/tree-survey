<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>수목 현장 조사</title>
    <style>
        html, body { margin:0; padding:0; height:100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #map-wrapper {
            width: 100%;
            height: 72%;
            overflow: hidden;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
            transition: transform 0.2s ease-in-out;
        }

        #map.zoomed {
            width: 50%;
            height: 50%;
            transform: scale(2);
        }

        #zoom-toggle-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            background: #ffffff;
            color: #333333;
            border: 1px solid #cccccc;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            user-select: none;
        }
        #zoom-toggle-btn.active {
            background: #007bff;
            color: #ffffff;
            border-color: #0056b3;
        }

        /* 오른쪽 중앙 나침반 토글 버튼 스타일 */
        #compass-btn {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            z-index: 10;
            background: #ffffff;
            color: #1c7ed6;
            border: 2px solid #1c7ed6;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
            user-select: none;
            transition: background-color 0.2s, color 0.2s;
        }
        #compass-btn.active {
            background: #1c7ed6;
            color: #ffffff;
        }

        /* 수목 저장 완료된 원번호 마커 (초록색) */
        .number-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 14px;
            height: 14px;
            background-color: #2b8a3e;
            color: #ffffff;
            font-size: 9px;
            font-weight: bold;
            border-radius: 50%;
            border: 1.5px solid #ffffff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
            cursor: pointer;
            user-select: none;
            line-height: 1;
        }
        .number-badge:active { transform: scale(1.2); }

        /* 내 위치 실시간 방향 화살표 마커 (파란색) */
        .my-location-badge {
            width: 14px;
            height: 14px;
            background-color: #1c7ed6;
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .my-location-badge::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 7px solid #ffffff;
            position: absolute;
            top: -5px;
        }

        #panel {
            height: 28%;
            background: #ffffff;
            border-top: 1px solid #ccc;
            box-sizing: border-box;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            transition: height 0.3s ease;
        }
        #panel.collapsed { height: 36px; }

        #panel-toggle-bar {
            height: 36px;
            background: #f1f3f5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            font-size: 13px;
            font-weight: bold;
            color: #495057;
            cursor: pointer;
            border-bottom: 1px solid #dee2e6;
            user-select: none;
        }

        #panel-body {
            flex: 1;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        #panel.collapsed #panel-body { display: none; }

        .input-row { display: flex; gap: 6px; }
        .combo-box { display: flex; flex: 1.2; gap: 3px; }

        /* 입력창 및 셀렉트 박스 높이 40px로 확대 */
        input, select { 
            width: 100%; height: 40px; font-size: 14px; 
            border-radius: 6px; border: 1px solid #ddd; box-sizing: border-box; padding: 0 8px;
        }
        input[readonly] { background-color: #f5f5f5; color: #666; height: 34px; font-size: 12px; }

        .select-quick {
            width: 38px; min-width: 38px; padding: 0 2px; text-align: center;
            background-color: #f8f9fa; border-color: #ced4da; cursor: pointer;
        }

        /* 노션 전송 버튼 높이를 40px로 넉넉하게 확대 */
        .btn-send { 
            width: 100%; height: 40px; font-size: 15px;
            background-color: #2b8a3e; color: white; font-weight: bold; 
            border: none; border-radius: 6px; cursor: pointer;
        }
        .btn-send:disabled { background-color: #82c91e; cursor: not-allowed; }

        #last-sent-box {
            padding: 4px 8px;
            background-color: #f0fdf4;
            border: 1px solid #2b8a3e;
            border-radius: 6px;
            font-size: 11px;
            color: #222;
            display: none;
        }
        .last-sent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-resend {
            background-color: #e03131; color: white; font-size: 10px; font-weight: bold;
            border: none; border-radius: 3px; padding: 1px 5px; cursor: pointer; width: auto; height: auto;
        }
    </style>
    <!-- 카카오맵 JS SDK -->
    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4010951d8779c420a474f095fd26c0a6&autoload=false"></script>
</head>
<body>
    <div id="map-wrapper">
        <button id="zoom-toggle-btn">🔍 2배 확대 ON/OFF</button>
        <!-- 오른쪽 중앙 나침반 방향 토글 버튼 -->
        <button id="compass-btn" onclick="toggleCompassMode()" title="실시간 시선 방향 및 위치 표시 토글">🧭</button>
        <div id="map"></div>
    </div>
    
    <div id="panel" class="">
        <div id="panel-toggle-bar" onclick="togglePanel()">
            <span>🌳 수목 조사 입력폼</span>
            <span id="toggle-arrow">▲ 폼 숨기기</span>
        </div>

        <div id="panel-body">
            <!-- 1행: 번호 + 수종 -->
            <div class="input-row">
                <input type="text" id="treeId" placeholder="번호 (예: 101)" style="flex: 0.8;">
                <div class="combo-box">
                    <input type="text" id="species" placeholder="수종 직접 입력">
                    <select id="species-select" class="select-quick" onchange="applyQuickValue('species', this)">
                        <option value="">▼</option>
                    </select>
                </div>
            </div>

            <!-- 2행: 주수 + 상태 -->
            <div class="input-row">
                <input type="number" id="quantity" placeholder="주수 (예: 1)" style="flex: 0.8;">
                <div class="combo-box">
                    <input type="text" id="status" placeholder="상태 직접 입력">
                    <select id="status-select" class="select-quick" onchange="applyQuickValue('status', this)">
                        <option value="">▼</option>
                    </select>
                </div>
            </div>

            <input type="text" id="coords" readonly placeholder="지도를 터치하여 위치를 지정하세요">
            <button id="sendBtn" class="btn-send" onclick="sendToNotion()">노션 DB로 전송</button>

            <div id="last-sent-box">
                <div class="last-sent-header">
                    <strong id="status-title" style="color: #2b8a3e;">[선택 정보]</strong>
                    <span id="last-sent-info">-</span>
                    <button class="btn-resend" onclick="resendToNotion()">↻ 재전송</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        kakao.maps.load(function() {
            const params = new URLSearchParams(window.location.search);
            const masterId = params.get("master_id") || "";
            const centerLat = parseFloat(params.get("lat")) || 37.5794;
            const centerLng = parseFloat(params.get("lng")) || 126.9033;
            
            const mapContainer = document.getElementById('map');
            const mapOptions = { 
                center: new kakao.maps.LatLng(centerLat, centerLng), 
                level: 1 
            };
            const map = new kakao.maps.Map(mapContainer, mapOptions);

            let activeMarker = null; 
            let myLocationOverlay = null; 
            let myLocationEl = null;
            let selectedCoords = null;
            let isZoomed = false;

            let isDragging = false;
            let startX = 0, startY = 0;
            
            let isCompassActive = false;
            let watchId = null;

            const zoomBtn = document.getElementById("zoom-toggle-btn");
            const compassBtn = document.getElementById("compass-btn");
            const mapWrapper = document.getElementById("map-wrapper");
            const webhookUrl = "https://hook.eu2.make.com/by8xkdrp85r5m6pu9f6vq7bj5f81yhr1";
            let lastPayload = null;

            function updateMyLocation(lat, lng, heading) {
                const locPosition = new kakao.maps.LatLng(lat, lng);

                if (!myLocationOverlay) {
                    myLocationEl = document.createElement('div');
                    myLocationEl.className = 'my-location-badge';

                    myLocationOverlay = new kakao.maps.CustomOverlay({
                        position: locPosition,
                        content: myLocationEl,
                        xAnchor: 0.5,
                        yAnchor: 0.5,
                        zIndex: 5
                    });
                    myLocationOverlay.setMap(map);
                } else {
                    myLocationOverlay.setPosition(locPosition);
                }

                if (heading !== null && !isNaN(heading) && myLocationEl) {
                    myLocationEl.style.transform = `rotate(${heading}deg)`;
                }
            }

            window.toggleCompassMode = function() {
                isCompassActive = !isCompassActive;

                if (isCompassActive) {
                    compassBtn.classList.add("active");
                    
                    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                        DeviceOrientationEvent.requestPermission().then(response => {
                            if (response === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation, true);
                            }
                        }).catch(console.error);
                    } else if (window.DeviceOrientationEvent) {
                        window.addEventListener('deviceorientation', handleOrientation, true);
                    }

                    if (navigator.geolocation) {
                        watchId = navigator.geolocation.watchPosition(function(position) {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;
                            updateMyLocation(lat, lng, null);
                            map.setCenter(new kakao.maps.LatLng(lat, lng));
                        }, null, { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
                    }
                } else {
                    compassBtn.classList.remove("active");

                    if (watchId !== null) {
                        navigator.geolocation.clearWatch(watchId);
                        watchId = null;
                    }
                    if (window.DeviceOrientationEvent) {
                        window.removeEventListener('deviceorientation', handleOrientation, true);
                    }

                    if (myLocationOverlay) {
                        myLocationOverlay.setMap(null);
                        myLocationOverlay = null;
                        myLocationEl = null;
                    }
                }
            };

            function handleOrientation(event) {
                let heading = null;
                if (event.webkitCompassHeading) {
                    heading = event.webkitCompassHeading;
                } else if (event.alpha) {
                    heading = 360 - event.alpha;
                }

                if (heading !== null && myLocationEl) {
                    myLocationEl.style.transform = `rotate(${heading}deg)`;
                }
            }

            window.togglePanel = function() {
                const panel = document.getElementById('panel');
                const toggleArrow = document.getElementById('toggle-arrow');
                const mapWrapper = document.getElementById('map-wrapper');
                
                panel.classList.toggle('collapsed');
                if (panel.classList.contains('collapsed')) {
                    toggleArrow.textContent = "▼ 폼 펼치기";
                    mapWrapper.style.height = "calc(100% - 36px)";
                } else {
                    toggleArrow.textContent = "▲ 폼 숨기기";
                    mapWrapper.style.height = "72%";
                }
                setTimeout(() => { map.relayout(); }, 200);
            };

            zoomBtn.addEventListener("click", function() {
                isZoomed = !isZoomed;
                const currentCenter = map.getCenter();
                
                if (isZoomed) {
                    mapContainer.classList.add("zoomed");
                    zoomBtn.classList.add("active");
                    zoomBtn.textContent = "🔍 2배 확대 [켜짐]";
                } else {
                    mapContainer.classList.remove("zoomed");
                    zoomBtn.classList.remove("active");
                    zoomBtn.textContent = "🔍 2배 확대 ON/OFF";
                }
