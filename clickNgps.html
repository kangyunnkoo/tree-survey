<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>수목 위치 선택 (좌측 상단 확대 버튼)</title>
  <style>
    html, body { margin:0; padding:0; height:100%; overflow: hidden; }
    
    #map-wrapper {
      width: 100%;
      height: 85%;
      overflow: hidden;
      position: relative;
    }

    /* scale(1) 기본 상태, .zoomed 클래스가 추가되면 scale(2) 적용 */
    #map {
      width: 100%;
      height: 100%;
      transform: scale(1);
      transform-origin: center center;
      transition: transform 0.2s ease-in-out;
    }

    #map.zoomed {
      transform: scale(2);
    }

    /* 화면 맨 왼쪽 위로 이동된 2배 확대 토글 버튼 */
    #zoom-toggle-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      background: #ffffff;
      color: #333333;
      border: 1px solid #cccccc;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      user-select: none;
    }

    #zoom-toggle-btn.active {
      background: #007bff;
      color: #ffffff;
      border-color: #0056b3;
    }

    #panel {
      height:15%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px;
      background:#f4f4f4;
      border-top:1px solid #ccc;
      font-size:14px;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
    }
    #coords { flex:1; }
    #saveBtn {
      padding:8px 14px;
      font-size:14px;
      background:#007bff;
      color:white;
      border:none;
      border-radius:4px;
      cursor:pointer;
    }
    #saveBtn:disabled {
      background:#aaa;
      cursor:not-allowed;
    }
  </style>
  <!-- 카카오맵 JS SDK -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=4010951d8779c420a474f095fd26c0a6"></script>
</head>
<body>
  <div id="map-wrapper">
    <!-- 화면 맨 왼쪽 위 배치 -->
    <button id="zoom-toggle-btn">🔍 2배 확대 ON/OFF</button>
    <div id="map"></div>
  </div>
  <div id="panel">
    <div id="coords">지도에서 수목 위치를 클릭하세요.</div>
    <button id="saveBtn" disabled>저장</button>
  </div>

  <script>
    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const name = params.get("name");
      const centerLat = parseFloat(params.get("centerLat"));
      const centerLng = parseFloat(params.get("centerLng"));
      const mapContainer = document.getElementById('map');
      
      const mapOptions = { 
        center: new kakao.maps.LatLng(37.5665, 126.9780), 
        level: 1 
      };
      const map = new kakao.maps.Map(mapContainer, mapOptions);

      let centerMarker = null; // 현재 위치 마커
      let userMarker = null;   // 사용자가 클릭한 마커
      let selectedCoords = null;
      let isZoomed = false;    // 2배 확대 상태 플래그

      const coordsBox = document.getElementById("coords");
      const saveBtn = document.getElementById("saveBtn");
      const zoomBtn = document.getElementById("zoom-toggle-btn");

      // 중심 마커 이미지 (빨간색)
      const centerImage = new kakao.maps.MarkerImage(
        "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png",
        new kakao.maps.Size(24, 35)
      );

      // -------------------------------------------------------------
      // 1. 2배 확대 토글 버튼 이벤트
      // -------------------------------------------------------------
      zoomBtn.addEventListener("click", function() {
        isZoomed = !isZoomed;
        
        if (isZoomed) {
          mapContainer.classList.add("zoomed");
          zoomBtn.classList.add("active");
          zoomBtn.textContent = "🔍 2배 확대 [켜짐]";
        } else {
          mapContainer.classList.remove("zoomed");
          zoomBtn.classList.remove("active");
          zoomBtn.textContent = "🔍 2배 확대 ON/OFF";
        }
      });

      // -------------------------------------------------------------
      // 2. GPS로 현재 위치 가져오기
      // -------------------------------------------------------------
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
          const lat = centerLat || position.coords.latitude;
          const lng = centerLng || position.coords.longitude;
          const locPosition = new kakao.maps.LatLng(lat, lng);
          map.setCenter(locPosition);

          centerMarker = new kakao.maps.Marker({
            position: locPosition,
            map: map,
            image: centerImage
          });
        }, function(error) {
          console.warn("현재 위치를 가져올 수 없습니다.", error);
          const fallback = new kakao.maps.LatLng(37.5665, 126.9780);
          map.setCenter(fallback);
          centerMarker = new kakao.maps.Marker({
            position: fallback,
            map: map,
            image: centerImage
          });
        });
      } else {
        const fallback = new kakao.maps.LatLng(37.5665, 126.9780);
        map.setCenter(fallback);
        centerMarker = new kakao.maps.Marker({
          position: fallback,
          map: map,
          image: centerImage
        });
      }

      // -------------------------------------------------------------
      // 3. 지도 클릭 이벤트 (확대 상태에 따른 좌표 변환)
      // -------------------------------------------------------------
      mapContainer.addEventListener('click', function(e) {
        const rect = mapContainer.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;

        const projection = map.getProjection();
        const point = new kakao.maps.Point(clickX, clickY);
        const latlng = projection.coordsFromContainerPoint(point);

        selectLocation(latlng);
      });

      // -------------------------------------------------------------
      // 4. 좌표 선택 공통 처리
      // -------------------------------------------------------------
      function selectLocation(latlng) {
        if (userMarker) userMarker.setMap(null);
        
        userMarker = new kakao.maps.Marker({
          position: latlng,
          map: map
        });
        
        selectedCoords = { lat: latlng.getLat(), lng: latlng.getLng() };
        coordsBox.textContent = `선택된 좌표 → 위도: ${selectedCoords.lat.toFixed(6)}, 경도: ${selectedCoords.lng.toFixed(6)}`;
        saveBtn.disabled = false;
      }

      // -------------------------------------------------------------
      // 5. 저장 및 Webhook 전송
      // -------------------------------------------------------------
      saveBtn.addEventListener("click", async function() {
        if (!selectedCoords) return;
        
        try {
          const res = await fetch("https://hook.eu2.make.com/by8xkdrp85r5m6pu9f6vq7bj5f81yhr1", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: name,
              latitude: selectedCoords.lat,
              longitude: selectedCoords.lng
            })
          });

          if (!res.ok) throw new Error("Webhook 응답 실패: " + res.status);
        
          alert("좌표가 Webhook으로 전송되었습니다!");
        
          const canClose = !!window.opener || /notion/i.test(navigator.userAgent) || /wv|webview|android.*version/i.test(navigator.userAgent);
        
          if (canClose) {
            setTimeout(() => {
              try {
                window.close();
              } catch (e) {
                console.warn("window.close() 실패:", e);
              }
            }, 200);
            return;
          }
        
          document.getElementById("coords").textContent = "좌표 전송 완료. 이 창을 닫아주세요.";
          
        } catch (err) {
          console.error("저장 실패:", err);
          alert("좌표 전송 중 오류가 발생했습니다.");
        }
      });

      const mapTypeControl = new kakao.maps.MapTypeControl();
      map.addControl(mapTypeControl, kakao.maps.ControlPosition.TOPRIGHT);
    }
  </script>
</body>
</html>
