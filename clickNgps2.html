<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>수목 현장 조사 - 자동 관계형 매칭</title>
    <!-- 카카오 지도 API (발급받은 JavaScript 키로 교체) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_APP_KEY"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        #map { width: 100%; height: 100%; }
        #info-box {
            position: absolute; bottom: 20px; left: 5%; width: 90%;
            background: rgba(255, 255, 255, 0.95); padding: 16px; box-sizing: border-box;
            border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.25); z-index: 10;
        }
        .title { font-size: 16px; font-weight: bold; color: #222; margin-bottom: 8px; display: block; }
        input, button { 
            width: 100%; height: 42px; margin-top: 8px; font-size: 15px; 
            border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; padding: 0 12px;
        }
        input[readonly] { background-color: #f5f5f5; color: #666; }
        button { 
            background-color: #2b8a3e; color: white; font-weight: bold; 
            border: none; font-size: 16px; margin-top: 12px; cursor: pointer;
        }
        button:active { background-color: #237032; }
    </style>
</head>
<body>

<div id="map"></div>

<div id="info-box">
    <span class="title">🌳 수목 위치 선택 및 정보 입력</span>
    <input type="text" id="treeId" placeholder="수목 번호 (예: 101)">
    <input type="text" id="status" placeholder="상태/수종 (예: 철쭉류 50주)">
    <input type="text" id="coords" readonly placeholder="지도를 터치하여 위치를 지정하세요">
    <button onclick="sendToNotion()">노션 DB로 전송</button>
</div>

<script>
    // 1. URL 파라미터(master_id, lat, lng) 추출
    function getUrlParams() {
        var params = {};
        window.location.search.replace(/[?&]+([^=&]+)=([^&]*)/gi, function(str, key, value) {
            params[key] = decodeURIComponent(value);
        });
        return params;
    }

    var params = getUrlParams();
    var masterId = params.master_id || ""; // Master DB 페이지 ID
    
    // 기본 중심 좌표 (파라미터가 없을 경우 기본 좌표)
    var defaultLat = params.lat ? parseFloat(params.lat) : 37.5794;
    var defaultLng = params.lng ? parseFloat(params.lng) : 126.9033;

    // 2. 카카오 지도 생성 및 파라미터 중심 위치로 이동
    var container = document.getElementById('map');
    var options = { 
        center: new kakao.maps.LatLng(defaultLat, defaultLng), 
        level: 2 // 현장 수목 식별에 적합한 확대 레벨
    };
    var map = new kakao.maps.Map(container, options);

    var currentLat = null;
    var currentLng = null;
    var marker = new kakao.maps.Marker({ map: map });

    // 3. 지도 터치/클릭 이벤트 - 선택 위치 좌표 추출 및 마커 표시
    kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
        var latLng = mouseEvent.latLng;
        currentLat = latLng.getLat();
        currentLng = latLng.getLng();

        // 선택 위치로 마커 이동
        marker.setPosition(latLng);

        // 입력창에 좌표 표시
        document.getElementById('coords').value = currentLat.toFixed(6) + ', ' + currentLng.toFixed(6);
    });

    // 4. Make.com Webhook으로 전달 (Notion DB 전송 및 관계형 자동 연결)
    function sendToNotion() {
        var treeId = document.getElementById('treeId').value;
        var status = document.getElementById('status').value;

        if (!currentLat || !treeId) {
            alert('지도를 터치하여 위치를 선택하고 수목 번호를 입력해 주세요.');
            return;
        }

        // Make.com에서 생성한 Webhook URL 입력
        var webhookUrl = "YOUR_MAKE_WEBHOOK_URL"; 

        fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                master_id: masterId, // Master DB와 자동 매칭되는 Page ID
                tree_id: treeId,
                status: status,
                lat: currentLat,
                lng: currentLng
            })
        })
        .then(response => {
            alert('노션 DB 전송 완료!');
            // 입력 폼 초기화 (연속 입력을 위해 위치 정보 및 상태 일부 유지 가능)
            document.getElementById('treeId').value = '';
            document.getElementById('status').value = '';
        })
        .catch(error => {
            alert('전송 중 오류 발생: ' + error);
        });
    }
</script>
</body>
</html>
