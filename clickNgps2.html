<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>수목 현장 조사 - 마커 관리 및 선택 입력 개선</title>
    <!-- 카카오 지도 API -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=4010951d8779c420a474f095fd26c0a6"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        #map { width: 100%; height: 100%; }
        #info-box {
            position: absolute; bottom: 15px; left: 5%; width: 90%;
            background: rgba(255, 255, 255, 0.96); padding: 16px; box-sizing: border-box;
            border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.25); z-index: 10;
            max-height: 85vh; overflow-y: auto;
        }
        .title { font-size: 16px; font-weight: bold; color: #222; margin-bottom: 8px; display: block; }
        .input-row { display: flex; gap: 8px; margin-top: 8px; }
        .input-group { flex: 1; display: flex; flex-direction: column; }
        input, button { 
            width: 100%; height: 40px; font-size: 15px; 
            border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; padding: 0 10px;
        }
        input[readonly] { background-color: #f5f5f5; color: #666; }
        
        /* 자주 쓰는 항목 추천 칩(Chip) 스타일 */
        .chip-container {
            display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px;
        }
        .chip {
            background-color: #e9ecef; color: #495057; font-size: 11px;
            padding: 3px 8px; border-radius: 12px; cursor: pointer;
            border: 1px solid #ced4da; font-weight: 500;
        }
        .chip:active { background-color: #2b8a3e; color: white; }

        .btn-send { 
            background-color: #2b8a3e; color: white; font-weight: bold; 
            border: none; font-size: 16px; margin-top: 10px; cursor: pointer;
        }
        .btn-send:disabled { background-color: #82c91e; cursor: not-allowed; }

        /* 최근 전송 정보 디스플레이 박스 */
        #last-sent-box {
            margin-top: 10px;
            padding: 10px 12px;
            background-color: #f0fdf4;
            border: 1px solid #2b8a3e;
            border-radius: 8px;
            font-size: 13px;
            color: #222;
            display: none;
        }
        .last-sent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .btn-resend {
            background-color: #e03131;
            color: white;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            width: auto;
            height: auto;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="map"></div>

<div id="info-box">
    <span class="title">🌳 수목 위치 선택 및 정보 입력</span>
    
    <!-- 1행: 번호 + 수종 -->
    <div class="input-row">
        <div class="input-group" style="flex: 0.8;">
            <input type="text" id="treeId" placeholder="번호 (예: 101)">
        </div>
        <div class="input-group" style="flex: 1.2;">
            <input type="text" id="species" placeholder="수종 직접 입력">
            <div class="chip-container">
                <span class="chip" onclick="setFieldValue('species', '왕벚나무')">왕벚나무</span>
                <span class="chip" onclick="setFieldValue('species', '벚나무류')">벚나무류</span>
                <span class="chip" onclick="setFieldValue('species', '팽나무')">팽나무</span>
                <span class="chip" onclick="setFieldValue('species', '소나무(반송)')">소나무(반송)</span>
                <span class="chip" onclick="setFieldValue('species', '소나무(장송)')">소나무(장송)</span>
            </div>
        </div>
    </div>

    <!-- 2행: 주수 + 상태 -->
    <div class="input-row">
        <div class="input-group" style="flex: 0.8;">
            <input type="number" id="quantity" placeholder="주수 (예: 1)">
        </div>
        <div class="input-group" style="flex: 1.2;">
            <input type="text" id="status" placeholder="상태 직접 입력">
            <div class="chip-container">
                <span class="chip" onclick="setFieldValue('status', '고사')">고사</span>
                <span class="chip" onclick="setFieldValue('status', '수간부후')">수간부후</span>
                <span class="chip" onclick="setFieldValue('status', '가지부후')">가지부후</span>
                <span class="chip" onclick="setFieldValue('status', '수세위약')">수세위약</span>
            </div>
        </div>
    </div>

    <input type="text" id="coords" readonly placeholder="지도를 터치하여 위치를 지정하세요" style="margin-top: 8px;">
    <button id="sendBtn" class="btn-send" onclick="sendToNotion()">노션 DB로 전송</button>

    <!-- 최근 전송/재전송 정보 박스 -->
    <div id="last-sent-box">
        <div class="last-sent-header">
            <strong id="status-title" style="color: #2b8a3e;">[노션 저장 완료]</strong>
            <button class="btn-resend" onclick="resendToNotion()">↻ 다시 전송</button>
        </div>
        <span id="last-sent-info">-</span>
    </div>
</div>

<script>
    function getUrlParams() {
        var params = {};
        window.location.search.replace(/[?&]+([^=&]+)=([^&]*)/gi, function(str, key, value) {
            params[key] = decodeURIComponent(value);
        });
        return params;
    }

    var params = getUrlParams();
    var masterId = params.master_id || ""; 
    var defaultLat = params.lat ? parseFloat(params.lat) : 37.5794;
    var defaultLng = params.lng ? parseFloat(params.lng) : 126.9033;

    var container = document.getElementById('map');
    var options = { center: new kakao.maps.LatLng(defaultLat, defaultLng), level: 2 };
    var map = new kakao.maps.Map(container, options);

    var currentLat = null;
    var currentLng = null;

    // 마커 변수 분리
    var activeMarker = null; // 현재 선택 입력 중인 임시 마커
    var savedMarkers = [];  // 전송 완료된 마커 모음

    var lastPayload = null;
    var webhookUrl = "https://hook.eu2.make.com/by8xkdrp85r5m6pu9f6vq7bj5f81yhr1";

    // 자주 쓰는 항목 클릭 시 입력창에 값 입력 함수
    function setFieldValue(fieldId, value) {
        document.getElementById(fieldId).value = value;
    }

    // 지도 터치 이벤트
    kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
        var latLng = mouseEvent.latLng;
        currentLat = latLng.getLat();
        currentLng = latLng.getLng();

        // 기존 클릭 마커가 없으면 새로 생성, 있으면 위치 이동
        if (!activeMarker) {
            activeMarker = new kakao.maps.Marker({
                position: latLng,
                map: map
            });
        } else {
            activeMarker.setPosition(latLng);
            activeMarker.setMap(map); // 화면에 다시 표시
        }

        document.getElementById('coords').value = currentLat.toFixed(6) + ', ' + currentLng.toFixed(6);
    });

    function sendToNotion() {
        var treeId = document.getElementById('treeId').value;
        var quantity = document.getElementById('quantity').value;
        var species = document.getElementById('species').value;
        var status = document.getElementById('status').value;

        if (!currentLat || !treeId) {
            alert('지도를 터치하여 위치를 선택하고 수목 번호를 입력해 주세요.');
            return;
        }

        lastPayload = {
            master_id: masterId,
            tree_id: treeId,
            quantity: quantity ? parseInt(quantity) : 1,
            species: species,
            status: status,
            lat: currentLat,
            lng: currentLng
        };

        executeFetch(lastPayload);
    }

    // 서버 전송 및 검증 처리 함수
    function executeFetch(payload) {
        var sendBtn = document.getElementById('sendBtn');
        sendBtn.disabled = true;
        sendBtn.innerText = "노션 저장 확인 중...";

        fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('서버 응답 오류 (' + response.status + ')');
            }
            return response.json();
        })
        .then(data => {
            if (data && data.status === "success") {
                alert('노션 DB에 정상적으로 데이터가 입력되었습니다!');
                
                // 1. 저장 완료된 위치에 영구 마커 추가
                var savedMarker = new kakao.maps.Marker({
                    position: new kakao.maps.LatLng(payload.lat, payload.lng),
                    map: map
                });
                savedMarkers.push(savedMarker);

                // 2. 현재 작업 중이던 임시 클릭 마커 제거 및 초기화
                if (activeMarker) {
                    activeMarker.setMap(null);
                    activeMarker = null;
                }

                // 3. UI 업데이트
                updateDisplayBox(payload, true);

                // 4. 입력 폼 초기화
                document.getElementById('treeId').value = '';
                document.getElementById('quantity').value = '';
                document.getElementById('species').value = '';
                document.getElementById('status').value = '';
                document.getElementById('coords').value = '';
                currentLat = null;
                currentLng = null;
            } else {
                throw new Error('노션 DB 입력 처리 실패');
            }
        })
        .catch(error => {
            alert('⚠️ [경고] 노션 저장에 실패했습니다!\n' + error.message + '\n하단의 [다시 전송] 버튼을 이용해 주세요.');
            updateDisplayBox(payload, false);
        })
        .finally(() => {
            sendBtn.disabled = false;
            sendBtn.innerText = "노션 DB로 전송";
        });
    }

    function updateDisplayBox(payload, isSuccess) {
        var displayBox = document.getElementById('last-sent-box');
        var statusTitle = document.getElementById('status-title');
        var displayInfo = document.getElementById('last-sent-info');

        if (isSuccess) {
            displayBox.style.backgroundColor = '#f0fdf4';
            displayBox.style.borderColor = '#2b8a3e';
            statusTitle.style.color = '#2b8a3e';
            statusTitle.innerText = '[노션 저장 완료]';
        } else {
            displayBox.style.backgroundColor = '#fff5f5';
            displayBox.style.borderColor = '#e03131';
            statusTitle.style.color = '#e03131';
            statusTitle.innerText = '[저장 실패 - 재전송 필요]';
        }

        displayInfo.innerHTML = `번호: <b>${payload.tree_id}</b> | 수종: <b>${payload.species || '-'}</b> | 주수: <b>${payload.quantity}</b> | 상태: <b>${payload.status || '-'}</b><br>좌표: ${payload.lat.toFixed(6)}, ${payload.lng.toFixed(6)}`;
        displayBox.style.display = 'block';
    }

    function resendToNotion() {
        if (!lastPayload) {
            alert('재전송할 최근 정보가 없습니다.');
            return;
        }
        executeFetch(lastPayload);
    }
</script>
</body>
</html>
