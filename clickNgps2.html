<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>수목 현장 조사 - 초슬림 입력폼</title>
    <!-- 카카오 지도 API -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=4010951d8779c420a474f095fd26c0a6"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        #map { width: 100%; height: 100%; }
        #info-box {
            position: absolute; bottom: 15px; left: 5%; width: 90%;
            background: rgba(255, 255, 255, 0.96); padding: 14px; box-sizing: border-box;
            border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.25); z-index: 10;
        }
        .title { font-size: 15px; font-weight: bold; color: #222; margin-bottom: 6px; display: block; }
        .input-row { display: flex; gap: 8px; margin-top: 6px; }
        .combo-box { display: flex; flex: 1.2; gap: 4px; }
        
        input, select, button { 
            width: 100%; height: 38px; font-size: 14px; 
            border-radius: 6px; border: 1px solid #ddd; box-sizing: border-box; padding: 0 8px;
        }
        input[readonly] { background-color: #f5f5f5; color: #666; }
        
        /* 선택용 드롭다운 스타일 (크기를 최소화하여 입력창 옆에 배치) */
        .select-quick {
            width: 42px; min-width: 42px; padding: 0 2px; text-align: center;
            background-color: #f8f9fa; border-color: #ced4da; cursor: pointer;
        }

        .btn-send { 
            background-color: #2b8a3e; color: white; font-weight: bold; 
            border: none; font-size: 15px; margin-top: 8px; cursor: pointer; height: 40px;
        }
        .btn-send:disabled { background-color: #82c91e; cursor: not-allowed; }

        /* 최근 전송 디스플레이 영역 */
        #last-sent-box {
            margin-top: 8px;
            padding: 8px 10px;
            background-color: #f0fdf4;
            border: 1px solid #2b8a3e;
            border-radius: 6px;
            font-size: 12px;
            color: #222;
            display: none;
        }
        .last-sent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }
        .btn-resend {
            background-color: #e03131; color: white; font-size: 11px; font-weight: bold;
            border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; width: auto; height: auto;
        }
    </style>
</head>
<body>

<div id="map"></div>

<div id="info-box">
    <span class="title">🌳 수목 위치 선택 및 정보 입력</span>
    
    <!-- 1행: 번호 + 수종(입력창 + 퀵선택) -->
    <div class="input-row">
        <input type="text" id="treeId" placeholder="번호 (예: 101)" style="flex: 0.8;">
        
        <div class="combo-box">
            <input type="text" id="species" placeholder="수종 직접 입력">
            <select class="select-quick" onchange="applyQuickValue('species', this)">
                <option value="">▼</option>
                <option value="철쭉류">철쭉류</option>
                <option value="왕벚나무">왕벚나무</option>
                <option value="벚나무류">벚나무류</option>
                <option value="팽나무">팽나무</option>
                <option value="소나무(반송)">소나무(반송)</option>
                <option value="소나무(장송)">소나무(장송)</option>
                <option value="노랑말채나무">노랑말채나무</option>
                <option value="흰말채나무">흰말채나무</option>
                <option value="회양목">회양목</option>
                <option value="병꽃나무">병꽃나무</option>
                <option value="(개)쉬땅나무">(개)쉬땅나무</option>
            </select>
        </div>
    </div>

    <!-- 2행: 주수 + 상태(입력창 + 퀵선택) -->
    <div class="input-row">
        <input type="number" id="quantity" placeholder="주수 (예: 1)" style="flex: 0.8;">
        
        <div class="combo-box">
            <input type="text" id="status" placeholder="상태 직접 입력">
            <select class="select-quick" onchange="applyQuickValue('status', this)">
                <option value="">▼</option>
                <option value="고사">고사</option>
                <option value="수간부후">수간부후</option>
                <option value="가지부후">가지부후</option>
                <option value="수세위약">수세위약</option>
                <option value="고사목">고사목</option>
                <option value="생육양호">생육양호</option>
            </select>
        </div>
    </div>

    <input type="text" id="coords" readonly placeholder="지도를 터치하여 위치를 지정하세요" style="margin-top: 6px;">
    <button id="sendBtn" class="btn-send" onclick="sendToNotion()">노션 DB로 전송</button>

    <!-- 최근 전송/재전송 정보 박스 -->
    <div id="last-sent-box">
        <div class="last-sent-header">
            <strong id="status-title" style="color: #2b8a3e;">[노션 저장 완료]</strong>
            <button class="btn-resend" onclick="resendToNotion()">↻ 다시 전송</button>
        </div>
        <span id="last-sent-info">-</span>
    </div>
</div>

<script>
    function getUrlParams() {
        var params = {};
        window.location.search.replace(/[?&]+([^=&]+)=([^&]*)/gi, function(str, key, value) {
            params[key] = decodeURIComponent(value);
        });
        return params;
    }

    var params = getUrlParams();
    var masterId = params.master_id || ""; 
    var defaultLat = params.lat ? parseFloat(params.lat) : 37.5794;
    var defaultLng = params.lng ? parseFloat(params.lng) : 126.9033;

    var container = document.getElementById('map');
    var options = { center: new kakao.maps.LatLng(defaultLat, defaultLng), level: 2 };
    var map = new kakao.maps.Map(container, options);

    var currentLat = null;
    var currentLng = null;

    var activeMarker = null; // 터치 시 생기는 임시 마커
    var savedMarkers = [];  // 저장 완료 마커 모음

    var lastPayload = null;
    var webhookUrl = "https://hook.eu2.make.com/by8xkdrp85r5m6pu9f6vq7bj5f81yhr1";

    // 드롭다운(▼) 선택 시 input 박스로 값 복사
    function applyQuickValue(fieldId, selectObj) {
        if (selectObj.value) {
            document.getElementById(fieldId).value = selectObj.value;
            selectObj.value = ""; // 선택 후 드롭다운은 다시 '▼'로 초기화
        }
    }

    // 지도 터치 이벤트
    kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
        var latLng = mouseEvent.latLng;
        currentLat = latLng.getLat();
        currentLng = latLng.getLng();

        if (!activeMarker) {
            activeMarker = new kakao.maps.Marker({
                position: latLng,
                map: map
            });
        } else {
            activeMarker.setPosition(latLng);
            activeMarker.setMap(map);
        }

        document.getElementById('coords').value = currentLat.toFixed(6) + ', ' + currentLng.toFixed(6);
    });

    function sendToNotion() {
        var treeId = document.getElementById('treeId').value;
        var quantity = document.getElementById('quantity').value;
        var species = document.getElementById('species').value;
        var status = document.getElementById('status').value;

        if (!currentLat || !treeId) {
            alert('지도를 터치하여 위치를 선택하고 수목 번호를 입력해 주세요.');
            return;
        }

        lastPayload = {
            master_id: masterId,
            tree_id: treeId,
            quantity: quantity ? parseInt(quantity) : 1,
            species: species,
            status: status,
            lat: currentLat,
            lng: currentLng
        };

        executeFetch(lastPayload);
    }

    function executeFetch(payload) {
        var sendBtn = document.getElementById('sendBtn');
        sendBtn.disabled = true;
        sendBtn.innerText = "노션 저장 확인 중...";

        fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('서버 응답 오류 (' + response.status + ')');
            }
            return response.json();
        })
        .then(data => {
            if (data && data.status === "success") {
                alert('노션 DB에 정상적으로 데이터가 입력되었습니다!');
                
                // 1. 저장 완료 마커 추가
                var savedMarker = new kakao.maps.Marker({
                    position: new kakao.maps.LatLng(payload.lat, payload.lng),
                    map: map
                });
                savedMarkers.push(savedMarker);

                // 2. 선택 임시 마커 제거
                if (activeMarker) {
                    activeMarker.setMap(null);
                    activeMarker = null;
                }

                // 3. UI 업데이트 및 폼 초기화
                updateDisplayBox(payload, true);

                document.getElementById('treeId').value = '';
                document.getElementById('quantity').value = '';
                document.getElementById('species').value = '';
                document.getElementById('status').value = '';
                document.getElementById('coords').value = '';
                currentLat = null;
                currentLng = null;
            } else {
                throw new Error('노션 DB 입력 처리 실패');
            }
        })
        .catch(error => {
            alert('⚠️ [경고] 노션 저장에 실패했습니다!\n' + error.message + '\n하단의 [다시 전송] 버튼을 이용해 주세요.');
            updateDisplayBox(payload, false);
        })
        .finally(() => {
            sendBtn.disabled = false;
            sendBtn.innerText = "노션 DB로 전송";
        });
    }

    function updateDisplayBox(payload, isSuccess) {
        var displayBox = document.getElementById('last-sent-box');
        var statusTitle = document.getElementById('status-title');
        var displayInfo = document.getElementById('last-sent-info');

        if (isSuccess) {
            displayBox.style.backgroundColor = '#f0fdf4';
            displayBox.style.borderColor = '#2b8a3e';
            statusTitle.style.color = '#2b8a3e';
            statusTitle.innerText = '[노션 저장 완료]';
        } else {
            displayBox.style.backgroundColor = '#fff5f5';
            displayBox.style.borderColor = '#e03131';
            statusTitle.style.color = '#e03131';
            statusTitle.innerText = '[저장 실패 - 재전송 필요]';
        }

        displayInfo.innerHTML = `번호: <b>${payload.tree_id}</b> | 수종: <b>${payload.species || '-'}</b> | 주수: <b>${payload.quantity}</b> | 상태: <b>${payload.status || '-'}</b><br>좌표: ${payload.lat.toFixed(6)}, ${payload.lng.toFixed(6)}`;
        displayBox.style.display = 'block';
    }

    function resendToNotion() {
        if (!lastPayload) {
            alert('재전송할 최근 정보가 없습니다.');
            return;
        }
        executeFetch(lastPayload);
    }
</script>
</body>
</html>
