<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>수목 현장 조사 - Realtime Input & Display</title>
    <!-- 카카오 지도 API 적용 -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=4010951d8779c420a474f095fd26c0a6"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        #map { width: 100%; height: 100%; }
        #info-box {
            position: absolute; bottom: 15px; left: 5%; width: 90%;
            background: rgba(255, 255, 255, 0.95); padding: 16px; box-sizing: border-box;
            border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.25); z-index: 10;
        }
        .title { font-size: 16px; font-weight: bold; color: #222; margin-bottom: 8px; display: block; }
        .input-row { display: flex; gap: 8px; margin-top: 8px; }
        input, button { 
            width: 100%; height: 42px; font-size: 15px; 
            border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; padding: 0 10px;
        }
        input[readonly] { background-color: #f5f5f5; color: #666; }
        button { 
            background-color: #2b8a3e; color: white; font-weight: bold; 
            border: none; font-size: 16px; margin-top: 10px; cursor: pointer;
        }
        button:active { background-color: #237032; }

        /* 방금 전 전송된 정보 표시 영역 (Display Field) */
        #last-sent-box {
            margin-top: 12px;
            padding: 10px 12px;
            background-color: #eeb00018;
            border: 1px solid #2b8a3e;
            border-radius: 8px;
            font-size: 13px;
            color: #222;
            display: none; /* 초기에는 숨김 */
        }
        #last-sent-box strong { color: #2b8a3e; }
    </style>
</head>
<body>

<div id="map"></div>

<div id="info-box">
    <span class="title">🌳 수목 위치 선택 및 정보 입력</span>
    
    <div class="input-row">
        <input type="text" id="treeId" placeholder="번호 (예: 101)" style="flex: 1;">
        <input type="number" id="quantity" placeholder="주수 (예: 50)" style="flex: 1;">
    </div>

    <div class="input-row">
        <input type="text" id="species" placeholder="수종 직접 입력" style="flex: 1.2;">
        <input type="text" id="status" placeholder="상태 직접 입력" style="flex: 1;">
    </div>

    <input type="text" id="coords" readonly placeholder="지도를 터치하여 위치를 지정하세요" style="margin-top: 8px;">
    <button onclick="sendToNotion()">노션 DB로 전송</button>

    <!-- 방금 저장된 정보를 보여주는 Display Field -->
    <div id="last-sent-box">
        <strong>[최근 전송 완료]</strong><br>
        <span id="last-sent-info">-</span>
    </div>
</div>

<script>
    // 1. URL 파라미터(master_id, lat, lng) 추출
    function getUrlParams() {
        var params = {};
        window.location.search.replace(/[?&]+([^=&]+)=([^&]*)/gi, function(str, key, value) {
            params[key] = decodeURIComponent(value);
        });
        return params;
    }

    var params = getUrlParams();
    var masterId = params.master_id || ""; 
    
    var defaultLat = params.lat ? parseFloat(params.lat) : 37.5794;
    var defaultLng = params.lng ? parseFloat(params.lng) : 126.9033;

    // 2. 카카오 지도 생성
    var container = document.getElementById('map');
    var options = { 
        center: new kakao.maps.LatLng(defaultLat, defaultLng), 
        level: 2 
    };
    var map = new kakao.maps.Map(container, options);

    var currentLat = null;
    var currentLng = null;
    var marker = new kakao.maps.Marker({ map: map });

    // 3. 지도 터치/클릭 이벤트
    kakao.maps.event.addListener(map, 'click', function(mouseEvent) {
        var latLng = mouseEvent.latLng;
        currentLat = latLng.getLat();
        currentLng = latLng.getLng();

        marker.setPosition(latLng);
        document.getElementById('coords').value = currentLat.toFixed(6) + ', ' + currentLng.toFixed(6);
    });

    // 4. Make.com Webhook으로 데이터 전송 및 Display Field 업데이트
    function sendToNotion() {
        var treeId = document.getElementById('treeId').value;
        var quantity = document.getElementById('quantity').value;
        var species = document.getElementById('species').value;
        var status = document.getElementById('status').value;

        if (!currentLat || !treeId) {
            alert('지도를 터치하여 위치를 선택하고 수목 번호를 입력해 주세요.');
            return;
        }

        var webhookUrl = "https://hook.eu2.make.com/by8xkdrp85r5m6pu9f6vq7bj5f81yhr1"; 

        var payload = {
            master_id: masterId,
            tree_id: treeId,
            quantity: quantity ? parseInt(quantity) : 1,
            species: species,
            status: status,
            lat: currentLat,
            lng: currentLng
        };

        fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(response => {
            alert('노션 DB 전송 완료!');

            // 최근 전송된 정보 Display Field 업데이트
            var displayBox = document.getElementById('last-sent-box');
            var displayInfo = document.getElementById('last-sent-info');
            
            displayInfo.innerHTML = `번호: <b>${treeId}</b> | 수종: <b>${species || '-'}</b> | 주수: <b>${quantity || 1}</b> | 상태: <b>${status || '-'}</b><br>좌표: ${currentLat.toFixed(6)}, ${currentLng.toFixed(6)}`;
            displayBox.style.display = 'block';

            // 입력 폼 초기화
            document.getElementById('treeId').value = '';
            document.getElementById('quantity').value = '';
            document.getElementById('species').value = '';
            document.getElementById('status').value = '';
            document.getElementById('coords').value = '';
            currentLat = null;
            currentLng = null;
        })
        .catch(error => {
            alert('전송 중 오류 발생: ' + error);
        });
    }
</script>
</body>
</html>
