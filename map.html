<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>수목 위치도</title>
  <style>
    /* 화면 전체를 가득 채우고 스크롤 제거 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
    }

    #map-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* 100% 크기에서 transform: scale(2) 및 회전 적용 */
    #map {
      width: 100%;
      height: 100%;
      transform: scale(2) rotate(var(--map-rotate, 0deg));
      transform-origin: center center;
      transition: transform 0.3s ease;
    }

    /* 우측 상단 회전 버튼 */
    #rotate-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 10;
      background: #ffffff;
      color: #333333;
      border: 1px solid #cccccc;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      user-select: none;
    }

    #rotate-btn:hover {
      background: #f0f0f0;
    }
  </style>
  <!-- 카카오맵 JS SDK -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=4010951d8779c420a474f095fd26c0a6"></script>
</head>
<body>
  <div id="map-wrapper">
    <button id="rotate-btn" onclick="rotateMap()">↻ 90° 회전 (현재 0°)</button>
    <div id="map"></div>
  </div>

  <script>
    // URL 파라미터 파싱
    const params = new URLSearchParams(window.location.search);
    const csvUrl = params.get("csv");
    const centerLat = parseFloat(params.get("centerLat")) || 37.5665; // 기본값: 서울시청
    const centerLng = parseFloat(params.get("centerLng")) || 126.9780;

    // 초기 중심 좌표 지정
    const initialCenter = new kakao.maps.LatLng(centerLat, centerLng);

    // 지도 생성 (level: 1)
    const mapContainer = document.getElementById("map");
    const mapOption = {
      center: initialCenter,
      level: 1
    };
    const map = new kakao.maps.Map(mapContainer, mapOption);

    // 생성된 마커 및 번호 데이터 추적 배열
    const markerList = [];

    // 1. InfoWindow 추적 관리
    let currentInfoWindow = null;

    kakao.maps.event.addListener(map, 'click', function() {
      if (currentInfoWindow) {
        currentInfoWindow.close();
        currentInfoWindow = null;
      }
    });

    // -------------------------------------------------------------
    // 2. 확대/축소(Zoom) 시 화면 중심 고정 보정 로직
    // -------------------------------------------------------------
    let zoomStartCenter = null;

    kakao.maps.event.addListener(map, 'zoom_start', function() {
      zoomStartCenter = map.getCenter();
    });

    kakao.maps.event.addListener(map, 'zoom_changed', function() {
      if (zoomStartCenter) {
        map.setCenter(zoomStartCenter);
      }
    });

    // -------------------------------------------------------------
    // 3. 정확한 중심 기준 회전 & 마커 역회전 & 정밀 드래그
    // -------------------------------------------------------------
    let currentAngle = 0;
    let isDragging = false;
    let startX = 0, startY = 0;

    function rotateMap() {
      // 회전 직전 사용자가 보고 있던 실제 중심 좌표 저장
      const visualCenter = map.getCenter();

      currentAngle = (currentAngle + 90) % 360;
      const mapEl = document.getElementById("map");
      
      // CSS 변수로 회전 적용
      mapEl.style.setProperty("--map-rotate", `${currentAngle}deg`);
      document.getElementById("rotate-btn").textContent = `↻ 90° 회전 (현재 ${currentAngle}°)`;

      // 기본 카카오맵 드래그 이벤트와 커스텀 마우스 드래그의 충돌 방지를 위해 회전 시 기본 드래그는 비활성화
      if (currentAngle !== 0) {
        map.setDraggable(false);
      } else {
        map.setDraggable(true);
      }

      // 회전각의 반대 방향으로 모든 마커 이미지 역회전 갱신
      updateMarkersRotation(currentAngle);

      // 회전 애니메이션 완료 후 정확히 기존 화면 중앙 위치로 복원
      setTimeout(() => {
        map.relayout();
        map.setCenter(visualCenter);
      }, 300);
    }

    // 모든 마커를 지도 회전각의 역방향으로 다시 그려서 교체하는 함수
    function updateMarkersRotation(mapAngle) {
      markerList.forEach(item => {
        const newImage = createNumberMarker(item.no, mapAngle);
        item.marker.setImage(newImage);
      });
    }

    // 회전 상태일 때의 커스텀 마우스 드래그 이동 정밀 보정
    const mapWrapperEl = document.getElementById("map-wrapper");

    mapWrapperEl.addEventListener("mousedown", (e) => {
      if (currentAngle === 0) return; // 0도일 때는 카카오맵 기본 드래그 동작
      if (e.button !== 0) return; // 좌클릭만 처리

      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging || currentAngle === 0) return;

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      startX = e.clientX;
      startY = e.clientY;

      // 화면 회전각(currentAngle)을 라디안으로 변환
      const rad = (currentAngle * Math.PI) / 180;

      // scale(2) 적용 상태 및 회전 좌표계 정밀 역변환
      // 화면이 회전함에 따라 마우스 이동 벡터를 지도 원래 좌표계로 매핑
      const correctedDx = (dx * Math.cos(rad) + dy * Math.sin(rad)) / 2;
      const correctedDy = (-dx * Math.sin(rad) + dy * Math.cos(rad)) / 2;

      // panBy는 (x, y) 픽셀만큼 지도를 이동시킴 (음수 부호 적용)
      map.panBy(-correctedDx, -correctedDy);
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
    });

    // -------------------------------------------------------------
    // 4. 역회전 보정이 포함된 고해상도 마커 생성 함수
    // -------------------------------------------------------------
    function createNumberMarker(num, mapAngle = 0) {
      const displaySize = 10;
      const scale = 2; // 레티나 보정

      const canvas = document.createElement("canvas");
      canvas.width = displaySize * scale;
      canvas.height = displaySize * scale;

      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);

      // 캔버스 중심을 기준으로 지도 회전각의 역방향(-mapAngle) 회전 적용
      ctx.translate(displaySize / 2, displaySize / 2);
      const rad = (-mapAngle * Math.PI) / 180;
      ctx.rotate(rad);

      // 원형 배경 (어두운 딥 블루)
      ctx.fillStyle = "#0d47a1";
      ctx.beginPath();
      ctx.arc(0, 0, displaySize / 2, 0, Math.PI * 2);
      ctx.fill();

      // 얇은 흰색 테두리
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 0.5;
      ctx.stroke();

      // 고해상도 선명 폰트 출력
      ctx.fillStyle = "#ffffff";
      const fontSize = String(num).length >= 2 ? "5.5px" : "6.5px";
      ctx.font = `bold ${fontSize} 'Malgun Gothic', Arial, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillText(num, 0, 0.3);

      const imageSize = new kakao.maps.Size(displaySize, displaySize);
      const imageOption = {
        offset: new kakao.maps.Point(displaySize / 2, displaySize / 2)
      };

      return new kakao.maps.MarkerImage(canvas.toDataURL("image/png"), imageSize, imageOption);
    }

    function parseCSV(text) {
      const rows = text.trim().split("\n").map(line => {
        const matches = line.match(/("([^"]|"")*"|[^,]+)(?=,|$)/g);
        return matches ? matches.map(s => s.replace(/^"|"$/g, "")) : [];
      });
      return rows;
    }

    async function loadCSV() {
      const res = await fetch(csvUrl);
      const text = await res.text();
      const rows = parseCSV(text);

      return rows.slice(1).map(r => ({
        no: r[0],
        name: r[1],
        status: r[2],
        lat: parseFloat(r[3]),
        lng: parseFloat(r[4])
      }));
    }

    async function drawMarkers() {
      const data = await loadCSV();

      data.forEach((row) => {
        const markerImage = createNumberMarker(row.no, currentAngle);
        const marker = new kakao.maps.Marker({
          position: new kakao.maps.LatLng(row.lat, row.lng),
          image: markerImage,
          map: map
        });

        // 생성된 마커와 번호 추적 배열에 등록
        markerList.push({
          no: row.no,
          marker: marker
        });

        const infowindow = new kakao.maps.InfoWindow({
          content: `<div style="padding:5px; white-space:nowrap;">${row.name}-${row.status}</div>`
        });

        kakao.maps.event.addListener(marker, "click", () => {
          if (currentInfoWindow === infowindow) {
            infowindow.close();
            currentInfoWindow = null;
          } else {
            if (currentInfoWindow) {
              currentInfoWindow.close();
            }
            infowindow.open(map, marker);
            currentInfoWindow = infowindow;
          }
        });
      });
    }

    // 페이지 로드 시 레이아웃 재배치 및 지정된 centerLat, centerLng 좌표로 화면 정중앙 고정
    setTimeout(() => {
      map.relayout();
      map.setCenter(initialCenter);
    }, 200);

    drawMarkers();
  </script>
</body>
</html>
