<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>수목 위치도</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: auto; /* 2배 확대된 영역 스크롤 지원 */
    }

    /* 지도 래퍼 */
    #map-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* [수정] 2배 크기(scale(2)) 및 뷰포트 중앙 기준 회전/확대 적용 */
    #map {
      width: 200%;
      height: 200%;
      transform: scale(2) rotate(var(--map-rotate, 0deg));
      transform-origin: 25% 25%; /* 200% 크기에서 화면 기준 중앙축을 맞추는 기준점 */
      transition: transform 0.3s ease; /* 회전 시 부드러운 애니메이션 */
    }

    /* 우측 상단 회전 버튼 스타일 */
    #rotate-btn {
      position: fixed; /* 스크롤 시에도 화면 우측 상단 고정 */
      top: 15px;
      right: 15px;
      z-index: 10;
      background: #ffffff;
      color: #333333;
      border: 1px solid #cccccc;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      user-select: none;
    }

    #rotate-btn:hover {
      background: #f0f0f0;
    }
  </style>
  <!-- 카카오맵 JS SDK -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=4010951d8779c420a474f095fd26c0a6"></script>
</head>
<body>
  <div id="map-wrapper">
    <!-- 회전 버튼 -->
    <button id="rotate-btn" onclick="rotateMap()">↻ 90° 회전 (현재 0°)</button>
    <div id="map"></div>
  </div>

  <script>
    // URL 파라미터 파싱
    const params = new URLSearchParams(window.location.search);
    const csvUrl = params.get("csv");  // 예: trees.csv
    const centerLat = parseFloat(params.get("centerLat")) || 37.5665; // 기본: 서울시청
    const centerLng = parseFloat(params.get("centerLng")) || 126.9780;

    // 지도 생성
    const mapContainer = document.getElementById("map");
    const mapOption = {
      center: new kakao.maps.LatLng(centerLat, centerLng),
      level: 1
    };
    const map = new kakao.maps.Map(mapContainer, mapOption);

    // 1. 현재 활성화된 InfoWindow 추적 변수
    let currentInfoWindow = null;

    // 2. 지도 영역(원번호 밖/빈 공간) 클릭 시 열려있는 InfoWindow 닫기
    kakao.maps.event.addListener(map, 'click', function() {
      if (currentInfoWindow) {
        currentInfoWindow.close();
        currentInfoWindow = null;
      }
    });

    // -------------------------------------------------------------
    // 3. 화면 중심 기준 지도 회전 & 드래그 보정 로직
    // -------------------------------------------------------------
    let currentAngle = 0;
    let isDragging = false;
    let startX = 0, startY = 0;

    function rotateMap() {
      // 1) 회전 전 현재 보고 있는 지도 중심 좌표 저장
      const currentCenter = map.getCenter();

      currentAngle = (currentAngle + 90) % 360;
      const mapEl = document.getElementById("map");
      
      // CSS 변수로 회전만 변경 (scale(2)는 유지)
      mapEl.style.setProperty("--map-rotate", `${currentAngle}deg`);
      document.getElementById("rotate-btn").textContent = `↻ 90° 회전 (현재 ${currentAngle}°)`;

      // 0도가 아닐 때는 카카오맵 기본 드래그를 끄고 커스텀 드래그 사용
      if (currentAngle !== 0) {
        map.setDraggable(false);
      } else {
        map.setDraggable(true);
      }

      // 2) 회전 후 타일 재배치 및 보던 좌표로 중심 복원
      setTimeout(() => {
        map.relayout();
        map.setCenter(currentCenter);
      }, 300);
    }

    // 마우스 커스텀 드래그 이벤트 (회전 상태일 때만 동작)
    const mapWrapperEl = document.getElementById("map-wrapper");

    mapWrapperEl.addEventListener("mousedown", (e) => {
      if (currentAngle === 0) return; // 0도일 때는 카카오맵 기본 드래그
      if (e.button !== 0) return;

      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging || currentAngle === 0) return;

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      startX = e.clientX;
      startY = e.clientY;

      // 회전 각도(라디안) 계산
      const rad = (currentAngle * Math.PI) / 180;

      // 마우스 이동 방향 벡터를 현재 지도 회전각만큼 역회전 변환
      // CSS scale(2) 상태이므로 이동 변화량도 절반(/2)으로 정밀 보정
      const correctedDx = (dx * Math.cos(rad) + dy * Math.sin(rad)) / 2;
      const correctedDy = (-dx * Math.sin(rad) + dy * Math.cos(rad)) / 2;

      // 카카오맵 픽셀 단위 지도 이동
      map.panBy(-correctedDx, -correctedDy);
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
    });

    // -------------------------------------------------------------
    // 4. 고해상도 번호 마커 및 데이터 로드 기능
    // -------------------------------------------------------------

    // Canvas 선명도 보정(Super-sampling) 적용 번호 마커 함수
    function createNumberMarker(num) {
      const displaySize = 10; // 지표에 실제 표시될 마커 크기
      const scale = 2;        // 캔버스 내부 해상도를 2배로 렌더링 (레티나 보정)

      const canvas = document.createElement("canvas");
      canvas.width = displaySize * scale;
      canvas.height = displaySize * scale;

      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);

      // 원형 배경 (어두운 딥 블루)
      ctx.fillStyle = "#0d47a1";
      ctx.beginPath();
      ctx.arc(displaySize / 2, displaySize / 2, displaySize / 2, 0, Math.PI * 2);
      ctx.fill();

      // 얇은 흰색 테두리
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 0.5;
      ctx.stroke();

      // 고해상도 선명 폰트 출력
      ctx.fillStyle = "#ffffff";
      const fontSize = String(num).length >= 2 ? "5.5px" : "6.5px";
      ctx.font = `bold ${fontSize} 'Malgun Gothic', Arial, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillText(num, displaySize / 2, displaySize / 2 + 0.3);

      const imageSize = new kakao.maps.Size(displaySize, displaySize);
      const imageOption = {
        offset: new kakao.maps.Point(displaySize / 2, displaySize / 2)
      };

      return new kakao.maps.MarkerImage(canvas.toDataURL("image/png"), imageSize, imageOption);
    }
    
    // CSV 파싱 함수
    function parseCSV(text) {
      const rows = text.trim().split("\n").map(line => {
        const matches = line.match(/("([^"]|"")*"|[^,]+)(?=,|$)/g);
        return matches ? matches.map(s => s.replace(/^"|"$/g, "")) : [];
      });
      return rows;
    }
    
    // CSV 데이터 로드
    async function loadCSV() {
      const res = await fetch(csvUrl);
      const text = await res.text();
      const rows = parseCSV(text);
    
      const data = rows.slice(1).map(r => {
        return {
          no: r[0],
          name: r[1],
          status: r[2],
          lat: parseFloat(r[3]),
          lng: parseFloat(r[4])
        };
      });
      return data;
    }
    
    // 마커 및 인포윈도우 그리기
    async function drawMarkers() {
      const data = await loadCSV();

      data.forEach((row, i) => {
        const marker = new kakao.maps.Marker({
          position: new kakao.maps.LatLng(row.lat, row.lng),
          image: createNumberMarker(row.no),
          map: map
        });

        const infowindow = new kakao.maps.InfoWindow({
          content: `<div style="padding:5px; white-space:nowrap;">${row.name}-${row.status}</div>`
        });

        // 마커 클릭 이벤트
        kakao.maps.event.addListener(marker, "click", (e) => {
          if (currentInfoWindow === infowindow) {
            // 이미 열려있던 창 → 토글하여 닫기
            infowindow.close();
            currentInfoWindow = null;
          } else {
            // 다른 창이 열려있으면 먼저 닫기
            if (currentInfoWindow) {
              currentInfoWindow.close();
            }
            // 새 창 열기
            infowindow.open(map, marker);
            currentInfoWindow = infowindow;
          }
        });
      });
    }

    // 초기 레이아웃 설정
    setTimeout(() => {
      map.relayout();
      map.setCenter(new kakao.maps.LatLng(centerLat, centerLng));
    }, 300);

    drawMarkers();
  </script>
</body>
</html>
