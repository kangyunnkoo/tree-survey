<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>수목 위치도</title>
  <style>
    /* 스크롤바 완전 제거 및 화면 가득 차게 설정 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* 불필요한 스크롤바 제거 */
      background-color: #000;
    }

    #map-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    /* 회전 시 여백이 보이지 않도록 영역을 약간 넓게 잡고 scale(2) 적용 */
    #map {
      width: 100%;
      height: 100%;
      transform: scale(2) rotate(var(--map-rotate, 0deg));
      transform-origin: center center; /* 회전 축을 항상 화면 중앙으로 고정 */
      transition: transform 0.3s ease; /* 회전 시 부드러운 전환 */
    }

    /* 우측 상단 회전 버튼 */
    #rotate-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 10;
      background: #ffffff;
      color: #333333;
      border: 1px solid #cccccc;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      user-select: none;
    }

    #rotate-btn:hover {
      background: #f0f0f0;
    }
    /* 카카오맵 내부 타일 이미지들에 그레이스케일 및 불투명도/흐림 효과 적용 */
    #map .leaflet-tile-container img, 
    #map img[src*="daumcdn.net"] {
        filter: opacity(0.5) blur(0.5px);
    }
  </style>
  <!-- 카카오맵 JS SDK -->
  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=4010951d8779c420a474f095fd26c0a6"></script>
</head>
<body>
  <div id="map-wrapper">
    <button id="rotate-btn" onclick="rotateMap()">↻ 90° 회전 (현재 0°)</button>
    <div id="map"></div>
  </div>

  <script>
    // URL 파라미터 파싱
    const params = new URLSearchParams(window.location.search);
    const csvUrl = params.get("csv");
    const centerLat = parseFloat(params.get("centerLat")) || 37.5665; // 기본: 서울시청
    const centerLng = parseFloat(params.get("centerLng")) || 126.9780;

    // 지도 생성 (level: 1로 처음부터 2배 근접 확대)
    const mapContainer = document.getElementById("map");
    const mapOption = {
      center: new kakao.maps.LatLng(centerLat, centerLng),
      level: 1
    };
    const map = new kakao.maps.Map(mapContainer, mapOption);

    // 1. InfoWindow 관리 변수
    let currentInfoWindow = null;

    kakao.maps.event.addListener(map, 'click', function() {
      if (currentInfoWindow) {
        currentInfoWindow.close();
        currentInfoWindow = null;
      }
    });

    // -------------------------------------------------------------
    // 2. 현재 보이는 화면 중심 기준 지도 회전
    // -------------------------------------------------------------
    let currentAngle = 0;
    let isDragging = false;
    let startX = 0, startY = 0;

    function rotateMap() {
      // 핵심: 회전하기 바로 전, 현재 사용자가 보고 있는 중심 좌표 추출
      const visualCenter = map.getCenter();

      currentAngle = (currentAngle + 90) % 360;
      const mapEl = document.getElementById("map");
      
      // CSS 변수로 회전 적용
      mapEl.style.setProperty("--map-rotate", `${currentAngle}deg`);
      document.getElementById("rotate-btn").textContent = `↻ 90° 회전 (현재 ${currentAngle}°)`;

      // 회전각이 0도가 아닐 때는 카카오맵 자체 드래그 방지 후 커스텀 마우스 드래그 처리
      if (currentAngle !== 0) {
        map.setDraggable(false);
      } else {
        map.setDraggable(true);
      }

      // 회전 전환 애니메이션(0.3s) 후 지도의 레이아웃과 중심점을 정확히 재맞춤
      setTimeout(() => {
        map.relayout();
        map.setCenter(visualCenter);
      }, 300);
    }

    // 회전 상태일 때의 마우스 커스텀 드래그 로직 (확대/축소 상태 관계없이 정확히 작동)
    const mapWrapperEl = document.getElementById("map-wrapper");

    mapWrapperEl.addEventListener("mousedown", (e) => {
      if (currentAngle === 0) return;
      if (e.button !== 0) return;

      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging || currentAngle === 0) return;

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      startX = e.clientX;
      startY = e.clientY;

      // 현재 회전각에 맞춰 마우스 이동 좌표계 회전 변환
      const rad = (currentAngle * Math.PI) / 180;
      const correctedDx = (dx * Math.cos(rad) + dy * Math.sin(rad)) / 2;
      const correctedDy = (-dx * Math.sin(rad) + dy * Math.cos(rad)) / 2;

      map.panBy(-correctedDx, -correctedDy);
    });

    window.addEventListener("mouseup", () => {
      isDragging = false;
    });

    // -------------------------------------------------------------
    // 3. 고해상도 번호 마커 및 데이터 로드
    // -------------------------------------------------------------
    function createNumberMarker(num) {
      const displaySize = 10;
      const scale = 2; // 레티나 선명도 보정

      const canvas = document.createElement("canvas");
      canvas.width = displaySize * scale;
      canvas.height = displaySize * scale;

      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);

      ctx.fillStyle = "#0d47a1";
      ctx.beginPath();
      ctx.arc(displaySize / 2, displaySize / 2, displaySize / 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 0.5;
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      const fontSize = String(num).length >= 2 ? "5.5px" : "6.5px";
      ctx.font = `bold ${fontSize} 'Malgun Gothic', Arial, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      ctx.fillText(num, displaySize / 2, displaySize / 2 + 0.3);

      const imageSize = new kakao.maps.Size(displaySize, displaySize);
      const imageOption = {
        offset: new kakao.maps.Point(displaySize / 2, displaySize / 2)
      };

      return new kakao.maps.MarkerImage(canvas.toDataURL("image/png"), imageSize, imageOption);
    }

    function parseCSV(text) {
      const rows = text.trim().split("\n").map(line => {
        const matches = line.match(/("([^"]|"")*"|[^,]+)(?=,|$)/g);
        return matches ? matches.map(s => s.replace(/^"|"$/g, "")) : [];
      });
      return rows;
    }

    async function loadCSV() {
      const res = await fetch(csvUrl);
      const text = await res.text();
      const rows = parseCSV(text);

      return rows.slice(1).map(r => ({
        no: r[0],
        name: r[1],
        status: r[2],
        lat: parseFloat(r[3]),
        lng: parseFloat(r[4])
      }));
    }

    async function drawMarkers() {
      const data = await loadCSV();

      data.forEach((row) => {
        const marker = new kakao.maps.Marker({
          position: new kakao.maps.LatLng(row.lat, row.lng),
          image: createNumberMarker(row.no),
          map: map
        });

        const infowindow = new kakao.maps.InfoWindow({
          content: `<div style="padding:5px; white-space:nowrap;">${row.name}-${row.status}</div>`
        });

        kakao.maps.event.addListener(marker, "click", () => {
          if (currentInfoWindow === infowindow) {
            infowindow.close();
            currentInfoWindow = null;
          } else {
            if (currentInfoWindow) {
              currentInfoWindow.close();
            }
            infowindow.open(map, marker);
            currentInfoWindow = infowindow;
          }
        });
      });
    }

    // 초기화 시 레이아웃 맞춤
    setTimeout(() => {
      map.relayout();
      map.setCenter(new kakao.maps.LatLng(centerLat, centerLng));
    }, 200);

    drawMarkers();
  </script>
</body>
</html>
